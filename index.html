<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小車長">
<meta name="theme-color" content="#80C241">
<title>小小車長・日本鐵道之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<style>

:root{--jy:#80C241;--ink:#1f2a37;--card:rgba(255,255,255,.94);--shadow:0 18px 50px rgba(15,30,50,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9cbe8;color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Hiragino Maru Gothic ProN","Noto Sans HK",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 58%,rgba(0,10,30,.28) 100%);z-index:1}
.hidden{display:none!important}
.num,.word,.tile{font-family:"Baloo 2","Arial Rounded MT Bold","PingFang HK",sans-serif}

/* 載入 */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#bfe0ff,#eaf6ff);font-size:26px;font-weight:800;z-index:60}
#loading .ld-train{font-size:84px;animation:chug .6s ease-in-out infinite alternate}
@keyframes chug{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}

/* 主頁 */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:24px;z-index:10;
  background:linear-gradient(rgba(10,30,60,.35),rgba(10,30,60,0) 45%,rgba(10,30,60,.25))}
.logo{text-align:center;color:#fff;text-shadow:0 4px 18px rgba(0,40,80,.5)}
.logo .l1{font-size:min(13vw,100px);font-weight:900;letter-spacing:.1em;line-height:1.05}
.logo .l2{font-size:min(5vw,34px);font-weight:800;margin-top:8px}
.routes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;width:min(96vw,1040px)}
@media (max-aspect-ratio:1/1){.routes{grid-template-columns:repeat(2,1fr)}}
.route{position:relative;border:none;border-radius:28px;background:var(--card);padding:18px 12px 16px;text-align:center;box-shadow:var(--shadow),inset 0 -6px 0 rgba(0,0,0,.06);transition:transform .15s}
.route:active{transform:scale(.96)}
.route .rc{width:80px;height:80px;margin:0 auto 10px;border-radius:50%;border:10px solid var(--c);display:flex;align-items:center;justify-content:center;font:800 26px "Baloo 2",sans-serif;color:#222;background:#fff}
.route .rn{font-size:27px;font-weight:900}
.route .re{font-size:14px;opacity:.6;font-weight:700}
.route .rs{margin-top:10px;font-size:16px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:7px 12px;display:inline-block}
.route.locked{filter:grayscale(.55);opacity:.75}
.route.locked .rs{background:#8a96a3}
.route .lock{position:absolute;top:10px;right:14px;font-size:22px}
.go{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.small{border:none;background:rgba(255,255,255,.85);border-radius:99px;padding:11px 22px;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;z-index:8;pointer-events:none}
#hud>*{pointer-events:auto}
.hbtn{flex:none;width:62px;height:62px;border:none;border-radius:20px;background:var(--card);font-size:30px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#lineBar{flex:1;display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:8px 36px 8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:62px}
.lb-badge{flex:none;width:46px;height:46px;border-radius:50%;border:6px solid var(--jy);display:flex;align-items:center;justify-content:center;font:800 15px "Baloo 2",sans-serif;background:#fff}
#lbTrack{position:relative;flex:1;height:46px}
#lbTrack .rail{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:9px;background:#dfe7d6}
#lbFill{position:absolute;left:0;top:13px;height:8px;border-radius:9px;background:var(--jy);width:0}
.lbst{position:absolute;top:7px;transform:translateX(-50%);text-align:center}
.lbst .dot{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--jy);margin:0 auto}
.lbst .nm{font-size:14px;font-weight:900;white-space:nowrap;margin-top:1px}
.lbst.done .dot{background:var(--jy)}
#lbTrain{position:absolute;top:-10px;font-size:30px;transform:translateX(-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
#stars{flex:none;background:var(--card);border-radius:20px;height:62px;padding:0 18px;display:flex;align-items:center;gap:6px;font:800 30px "Baloo 2",sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#stars.pop{animation:starpop .6s}
@keyframes starpop{40%{transform:scale(1.35) rotate(-8deg)}}

/* 站名牌 */
#banner{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:min(560px,86vw);background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:7;animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-170%)}to{transform:translate(-50%,0)}}
.bn-top{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 16px 6px}
.bn-num{width:64px;height:64px;border:6px solid var(--jy);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 17px/1 "Baloo 2",sans-serif}
.bn-num b{font-size:25px}
.bn-name{text-align:center}
.bn-kana{font-size:18px;font-weight:700;color:#444}
.bn-ja{font-size:54px;font-weight:900;line-height:1.05;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
.bn-en{font:700 20px "Baloo 2",sans-serif;color:#333}
.bn-band{display:flex;justify-content:space-between;background:var(--jy);color:#fff;font-weight:800;padding:8px 16px;font-size:18px;min-height:40px}

/* 問題卡 */
#qwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:88px 16px 16px;background:linear-gradient(rgba(8,20,35,0),rgba(8,20,35,.35));perspective:1400px}
#qcard{position:relative;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:1.8vh;background:var(--card);border-radius:36px;padding:22px 26px 26px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#qcard.swap{animation:swap .5s ease}
@keyframes swap{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
#qhead{display:flex;align-items:center;gap:14px}
#qcat{flex:none;color:#fff;font-weight:900;font-size:20px;padding:8px 16px;border-radius:99px}
#qprompt{flex:1;font-size:min(4.2vh,30px);font-weight:900;line-height:1.25}
#qsay{flex:none;width:66px;height:66px;border:none;border-radius:50%;background:#fff3c4;font-size:32px;box-shadow:0 5px 0 #e8cf72}
#qsay:active{transform:translateY(4px);box-shadow:0 1px 0 #e8cf72}
#qclose{position:absolute;top:-14px;right:-14px;width:56px;height:56px;border:none;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:2}
#qvis{min-height:28vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;text-align:center}
#qopts{display:grid;gap:18px}
#qopts.n2{grid-template-columns:1fr 1fr}
#qopts.n3{grid-template-columns:repeat(3,1fr)}
#qopts.n4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:min(21vh,170px);border:6px solid #e3e9f0;border-radius:30px;background:#fff;box-shadow:0 9px 0 #cfd8e2;font-size:min(10vh,76px);font-weight:900;display:flex;align-items:center;justify-content:center;padding:8px;transition:transform .08s}
.opt:active{transform:translateY(6px);box-shadow:0 3px 0 #cfd8e2}
.opt:disabled{opacity:.7}
.opt.good{background:#d8f8d2;border-color:#43b649;box-shadow:0 9px 0 #2f8f35;animation:bounce .5s;opacity:1}
.opt.bad{background:#ffe0e0;border-color:#f06464;box-shadow:0 9px 0 #c44;animation:shake .45s;opacity:1}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes bounce{40%{transform:scale(1.12)}}
.pic{font-size:min(23vh,200px);line-height:1.1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.18))}
.pic.sm{font-size:min(15vh,130px)}
.pic.shadow{filter:brightness(0) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.eq{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:linear-gradient(#f5f9ff,#e4eefb);border:4px solid #c9d8ee;border-radius:24px;padding:10px 12px}
.grp span{font-size:var(--es,54px);line-height:1.1;display:inline-block}
.grp span.gone{opacity:.25;filter:grayscale(1)}
.op{font:800 60px "Baloo 2",sans-serif;color:#2f7fe0}
.eqtxt{width:100%;font:800 min(8vh,60px) "Baloo 2",sans-serif;letter-spacing:.06em;color:#253548}
.tiles{display:flex;gap:10px;justify-content:center;width:100%}
.tile{min-width:min(10vh,78px);height:min(11vh,86px);border-radius:16px;background:#fff;border:4px solid #c8d3e0;font-size:min(8vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #c8d3e0;padding:0 6px}
.tile.zh{font-family:"PingFang HK",sans-serif;font-weight:700}
.tile.blank{background:#fff7d1;border-color:#f0c02e;border-style:dashed;color:#e0a500;animation:blink 1.2s infinite}
@keyframes blink{50%{background:#ffe98a}}
.word{font-size:min(7vh,52px);letter-spacing:.04em}
.zh{font-size:min(8vh,58px);font-weight:800}
.emo{font-size:min(12vh,92px);line-height:1}
.riddle{display:flex;align-items:center;gap:20px;max-width:780px;text-align:left}
.riddle .rq{font-size:min(15vh,116px)}
.riddle .rt{font-size:min(4.6vh,34px);font-weight:900;line-height:1.5;background:#fff8e1;border-radius:24px;padding:16px 22px;border:4px dashed #f3c14b}
.rebus{display:flex;align-items:center;gap:14px;font-size:min(15vh,116px)}
.rebus b{font:800 min(9vh,70px) "Baloo 2",sans-serif;color:#f08a24}
.rebus .qm{display:inline-flex;width:1.1em;height:1.1em;border-radius:24px;background:#fff7d1;border:5px dashed #f0c02e;align-items:center;justify-content:center;font-size:.7em}
.zoomwrap{position:relative;padding:10px 40px 40px 10px}
.zoomwin{position:relative;width:min(29vh,250px);height:min(29vh,250px);border-radius:50%;overflow:hidden;background:#fff;border:14px solid #3c4650;box-shadow:inset 0 0 30px rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.25)}
.zoomwin span{position:absolute;left:50%;top:50%;line-height:1}
.zoomwrap::after{content:"";position:absolute;width:26px;height:100px;background:linear-gradient(90deg,#6b4b2a,#8b6236);border-radius:14px;right:22px;bottom:-24px;transform:rotate(-45deg)}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq span{font-size:min(9vh,70px);background:#fff;border-radius:20px;padding:6px 10px;border:4px solid #e3e9f0;line-height:1.15}
.seq span.q{background:#fff7d1;border:4px dashed #f0c02e;min-width:1.4em}
.hint{font-size:min(5vh,36px);font-weight:900;color:#445}
.bigword{font-size:min(9vh,68px);font-weight:900}
.findgrid{display:grid;gap:6px;width:min(100%,760px);background:linear-gradient(#caa57a,#a97d4f);padding:12px;border-radius:24px;box-shadow:inset 0 0 0 6px #8a6238}
.fcell{border:none;background:rgba(255,255,255,.18);border-radius:16px;font-size:min(8.5vh,64px);padding:4px;line-height:1.2}
.fcell.found{background:#d8f8d2;box-shadow:0 0 0 5px #43b649 inset}
.fcell.bad{background:#ffd3d3;animation:shake .45s}
.optgrp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;font-size:min(8vh,60px);line-height:1.15;max-width:92%}

/* 彩紙、印章、完成 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf{position:absolute;top:-4vh;width:12px;height:20px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
#stampFx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;background:rgba(255,255,255,.15)}
.stamp{width:230px;height:230px;border-radius:50%;border:10px solid #d6263b;color:#d6263b;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,250,245,.95);box-shadow:0 0 0 5px rgba(255,250,245,.95),0 0 0 9px #d6263b;transform:rotate(-12deg);font-weight:900}
.stamp .s1{font-size:17px;letter-spacing:.2em}
.stamp .s2{font-size:64px;line-height:1.05;font-family:"Hiragino Mincho ProN","Songti TC",serif}
.stamp .s3{font-size:40px;line-height:1.1}
.stamp .s4{font:800 17px "Baloo 2",sans-serif;letter-spacing:.15em}
.stamp.big{animation:stampIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{from{transform:scale(2.6) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.stamp.mini{width:150px;height:150px;border-width:7px;box-shadow:0 0 0 4px #fff,0 0 0 7px #d6263b}
.stamp.mini .s2{font-size:40px}.stamp.mini .s3{font-size:24px}.stamp.mini .s1,.stamp.mini .s4{font-size:12px}
#finish{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(8,20,35,.35);padding:20px}
.fcard{background:var(--card);border-radius:40px;padding:30px 34px;text-align:center;box-shadow:var(--shadow);width:min(760px,100%);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.fcard h1{margin:0;font-size:min(8vh,54px)}
.fcard p{font-size:24px;font-weight:800;margin:10px 0 16px}
.stamps{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
.bigbtn{border:none;border-radius:24px;padding:18px 30px;font-size:27px;font-weight:900;color:#fff;background:var(--jy);box-shadow:0 8px 0 #5c9a2c;margin:6px 8px}
.bigbtn.alt{background:#5b8def;box-shadow:0 8px 0 #3d68c2}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,30,45,.82);color:#fff;font-size:24px;font-weight:800;padding:14px 26px;border-radius:99px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* 家長試玩 */
#test{position:fixed;inset:0;z-index:18;background:rgba(8,20,35,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.tcard{background:#fff;border-radius:32px;padding:24px;width:min(900px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.tcard h2{margin:0;font-size:30px}
.tcard .lv{display:flex;gap:10px;margin:14px 0 16px;align-items:center;font-weight:800;font-size:20px}
.tcard .lv button{border:none;border-radius:14px;padding:10px 18px;font-size:19px;font-weight:900;background:#eef2f7}
.tcard .lv button.on{background:var(--jy);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tgrid button{border:none;border-radius:18px;padding:15px 12px;font-size:19px;font-weight:800;background:#f4f7fb;border-left:8px solid var(--c);text-align:left}
.tsec{grid-column:1/-1;font-weight:900;font-size:18px;margin-top:8px;color:#556}

/* ===== v2 新增：車長玩法介面 ===== */
#vig{display:none}
.logo .l3{font-size:min(3.4vw,22px);font-weight:800;margin-top:10px;background:rgba(0,0,0,.28);display:inline-block;padding:6px 16px;border-radius:99px}

/* 速度／距離 */
#drivehud{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 88px);z-index:8;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#spd{background:rgba(10,18,28,.78);color:#7CFFB2;border-radius:18px;padding:6px 16px 4px;font-family:"Baloo 2",sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.25);text-align:right;min-width:150px}
#spd b{font-size:54px;line-height:1;font-weight:800}
#spd small{font-size:18px;color:#bfe;margin-left:6px}
#dist{background:rgba(255,255,255,.92);border-radius:16px;padding:6px 14px;font-weight:900;font-size:20px;display:flex;align-items:baseline;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#dist b{font:800 30px "Baloo 2",sans-serif;color:#2f7fe0}
#dist small{font-weight:800;color:#667}
#tascLamp{font:800 16px "Baloo 2",sans-serif;letter-spacing:.1em;padding:4px 12px;border-radius:10px;background:rgba(40,40,40,.6);color:#777}
#tascLamp.on{background:#1fc16b;color:#fff;box-shadow:0 0 18px #1fc16b}

/* 控制桿（Master Controller） */
#mascon{position:fixed;right:18px;bottom:22px;z-index:9;width:150px;background:linear-gradient(#2c3238,#1b1f23);border-radius:28px;padding:10px 12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);touch-action:none;user-select:none}
.mc-title{color:#cfd8df;text-align:center;font-weight:900;font-size:16px;margin-bottom:6px;letter-spacing:.2em}
#mcTrack{position:relative;height:min(52vh,420px);cursor:grab}
.mc-slot{position:absolute;left:50%;top:4%;bottom:4%;width:14px;margin-left:-7px;border-radius:9px;background:#0b0d0f;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
#mcLabels{position:absolute;inset:0}
.mcl{position:absolute;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:space-between;align-items:center;font:800 17px "Baloo 2",sans-serif;pointer-events:none}
.mcl span{padding:0 6px;border-radius:8px}
.mcl.p span{color:#7fc4ff}.mcl.n span{color:#fff}.mcl.b span{color:#ffb35c}.mcl.eb span{color:#ff5a5a}
.mcl.on span{background:rgba(255,255,255,.16)}
#mcKnob{position:absolute;left:50%;width:120px;height:44px;margin-left:-60px;transform:translateY(-50%);transition:top .12s ease-out;pointer-events:none}
.mc-grip{position:absolute;inset:0;border-radius:14px;background:linear-gradient(#555c63,#23272b);border:3px solid #9aa4ad;box-shadow:0 6px 12px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25)}
.mc-grip::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:8px;margin:-4px 0 0 -23px;border-radius:4px;background:#c9d1d8}

/* 駕駛室按鈕 */
#cabBtns{position:fixed;left:18px;bottom:22px;z-index:9;display:flex;flex-direction:column-reverse;gap:14px}
.cbtn{width:118px;height:108px;border:none;border-radius:28px;background:rgba(255,255,255,.94);font-size:44px;box-shadow:0 9px 0 #b9c3cc,0 14px 26px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cbtn span{font-size:19px;font-weight:900;margin-top:6px}
.cbtn:active{transform:translateY(6px);box-shadow:0 3px 0 #b9c3cc}
.cbtn.hot{background:#fff3b0;animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{transform:scale(1.08);box-shadow:0 9px 0 #e0b400,0 0 0 10px rgba(255,210,0,.35)}}

const G={state:'loading',s:0,prevS:0,v:0,a:0,notch:0,next:1,reached:0,stars:0,doors:0,doorT:0,time:0,gen:0,cam:'title',

/* ======================= 渲染器＋後期（光暈、暗角） ======================= */

/* ======================= 夕陽天空＋光 ======================= */

  fragmentShader:'uniform vec3 top,mid,bot,sunDir;uniform float uB;varying vec3 vW;void main(){vec3 d=normalize(vW-cameraPosition);float h=d.y;vec3 c=h>0.0?mix(mid,top,pow(clamp(h,0.0,1.0),0.6)):mix(mid,bot,pow(clamp(-h*3.0,0.0,1.0),0.5));float s=max(dot(d,normalize(sunDir)),0.0);c+=vec3(1.0,0.96,0.88)*(pow(s,900.0)*8.0+pow(s,10.0)*0.18);gl_FragColor=vec4(c*uB,1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'}));

{const pm=new THREE.PMREMGenerator(renderer);const es=new THREE.Scene();es.add(new THREE.Mesh(sky.geometry,sky.material));

  const bmat=new THREE.MeshBasicMaterial({color:0xaab3bc});for(let i=0;i<44;i++){const a=i/44*6.2832,h=80+((i*37)%9)*28;const b=new THREE.Mesh(new THREE.BoxGeometry(150,h,150),bmat);b.position.set(Math.cos(a)*900,h/2-20,Math.sin(a)*900);es.add(b);}
  scene.environment=pm.fromScene(es,0.04,1,5000).texture;pm.dispose();}

/* ======================= 貼圖／幾何小工具 ======================= */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function T(c,rep,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}return t;}
function speck(x,w,h,n,cols,r0,r1){for(let i=0;i<n;i++){x.globalAlpha=0.45+Math.random()*0.55;x.fillStyle=cols[i%cols.length];const r=r0+Math.random()*(r1-r0);x.beginPath();x.arc(Math.random()*w,Math.random()*h,r,0,6.2832);x.fill();}x.globalAlpha=1;}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
const JPF='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang HK",sans-serif';
// 由灰階高度圖生成法線貼圖（令碎石、枕木有立體感）
function normalFromHeight(hc,str=2){const w=hc.width,h=hc.height,src=hc.getContext('2d').getImageData(0,0,w,h).data;const [c,x]=cv(w,h);const img=x.createImageData(w,h),d=img.data;
  const H=(i,j)=>src[((((j%h)+h)%h)*w+(((i%w)+w)%w))*4]/255;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const nx=-(H(i+1,j)-H(i-1,j))*str,ny=(H(i,j+1)-H(i,j-1))*str,l=Math.hypot(nx,ny,1),k=(j*w+i)*4;d[k]=(nx/l*0.5+0.5)*255;d[k+1]=(ny/l*0.5+0.5)*255;d[k+2]=(1/l*0.5+0.5)*255;d[k+3]=255;}
  x.putImageData(img,0,0);return T(c,1,false);}
class Merger{constructor(vc=false){this.list=[];this.vc=vc;}
  add(geo,x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,col){const S=Array.isArray(s)?s:[s,s,s];return this.addM(geo,new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),new THREE.Vector3(S[0],S[1],S[2])),col);}
  addM(geo,m,col){const g=geo.index?geo.toNonIndexed():geo.clone();for(const k of Object.keys(g.attributes))if(k!=='position'&&k!=='normal'&&k!=='uv')g.deleteAttribute(k);const n=g.attributes.position.count;
    if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));
    if(this.vc){const c=new THREE.Color(col??0xffffff),a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));}
    g.clearGroups();g.applyMatrix4(m);this.list.push(g);return this;}
  mesh(mat,cast=true,recv=true){if(!this.list.length)return null;const o=new THREE.Mesh(mergeGeometries(this.list,false),mat);o.castShadow=cast;o.receiveShadow=recv;return o;}}

/* ======================= 路線（高架橋） ======================= */
const DECK=7.0, RT=DECK+0.62, PT=RT+1.1;   // 橋面、路軌頂、月台面高度
const V=(x,z)=>new THREE.Vector3(x,0,z);
const path=new THREE.CurvePath();

path.add(new THREE.LineCurve3(V(0,0),V(0,-420)));
path.add(new THREE.QuadraticBezierCurve3(V(0,-420),V(0,-560),V(70,-680)));
const D1=new THREE.Vector3(70,0,-120).normalize();
const P3=V(70,-680).add(D1.clone().multiplyScalar(260));
path.add(new THREE.LineCurve3(V(70,-680),P3.clone()));
const P4c=P3.clone().add(D1.clone().multiplyScalar(110));
const P4=new THREE.Vector3(P4c.x,0,P4c.z-150);
path.add(new THREE.QuadraticBezierCurve3(P3.clone(),P4c,P4.clone()));
path.add(new THREE.LineCurve3(P4.clone(),new THREE.Vector3(P4.x,0,P4.z-700)));
const CUM=path.getCurveLengths(), L=CUM[CUM.length-1], segS=i=>i?CUM[i-1]:0;
const STEP=0.5, NLP=Math.ceil(L/STEP)+2, LP=new Float32Array(NLP*2);
for(let i=0;i<NLP;i++){const p=path.getPoint(Math.min(1,i*STEP/L));LP[i*2]=p.x;LP[i*2+1]=p.z;}
function posAt(s,o=new THREE.Vector3()){s=s<0?0:s>L-0.01?L-0.01:s;const f=s/STEP,i=f|0,t=f-i,j=i*2;o.set(LP[j]+(LP[j+2]-LP[j])*t,0,LP[j+1]+(LP[j+3]-LP[j+1])*t);return o;}
const _d1=new THREE.Vector3(),_fr=new THREE.Vector3();
function dirAt(s,o=new THREE.Vector3()){posAt(s+1.2,o);posAt(s-1.2,_d1);return o.sub(_d1).normalize();}
function angOf(f){return Math.atan2(-f.x,-f.z);}
function frame(s,lat,y,o=new THREE.Vector3()){posAt(s,o);const f=dirAt(s,_fr);o.x+=-f.z*lat;o.z+=f.x*lat;o.y=y;return o;}
const TPTS=[];for(let s=0;s<L;s+=4){const p=posAt(s);TPTS.push(p.x,p.z);}

// 沿路軌掃出剖面（剖面＝[橫向, 高度]；latFn 可以令每段橫向偏移）
function sweep(prof,s0,s1,step,lat,uLen,vLen,latFn){
  const rows=Math.max(2,Math.ceil((s1-s0)/step)+1),n=prof.length;

  const pl=[0];for(let k=1;k<n;k++)pl[k]=pl[k-1]+Math.hypot(prof[k][0]-prof[k-1][0],prof[k][1]-prof[k-1][1]);

/* ======================= 高架橋、路軌、電線、訊號 ======================= */
function deckProf(lp){const P=[];
  if(lp)P.push([-3.0,6.0],[-3.0,8.1],[-3.0,8.1],[-2.75,8.1],[-2.75,8.1],[-2.75,7.0],[-2.75,7.0]);else P.push([-3.0,6.0],[-3.0,7.0],[-3.0,7.0]);
  P.push([6.75,7.0],[6.75,7.0],[6.75,8.1],[6.75,8.1],[7.0,8.1],[7.0,8.1],[7.0,6.0],[7.0,6.0],[-3.0,6.0]);return P;}
function bridgeProf(){return [[-3.0,6.3],[-3.0,7.0],[-3.0,7.0],[7.0,7.0],[7.0,7.0],[7.0,6.3],[7.0,6.3],[-3.0,6.3]];}
function buildViaduct(){const cuts=ST.map(q=>[q.stop-PB,q.stop+PF,0]).concat([[RIVER_S-25,RIVER_S+25,1]]).sort((a,b)=>a[0]-b[0]);let s=0;
  for(const [a,b,k] of cuts){if(a>s)mesh(sweep(deckProf(true),s,a,2,0,4,4),MT.deck,true,true);mesh(sweep(k?bridgeProf():deckProf(false),a,b,2,0,4,4),MT.deck,true,true);s=b;}
  if(s<L)mesh(sweep(deckProf(true),s,L,2,0,4,4),MT.deck,true,true);
  {const rm=new Merger(),Pp=new THREE.Vector3();for(const lat of [-2.95,6.95]){for(let q=RIVER_S-25;q<=RIVER_S+25;q+=2){frame(q,lat,7.5,Pp);rm.add(new THREE.BoxGeometry(0.06,1.0,0.06),Pp.x,7.5,Pp.z);}
    for(const hy of [7.55,8.0])cyl(rm,frame(RIVER_S-25,lat,hy),frame(RIVER_S+25,lat,hy),0.035,6);}scene.add(rm.mesh(MT.pole,true,false));}
  const ps=[];for(let q=6;q<L-4;q+=16){if(Math.abs(q-ROAD_S)<11||Math.abs(q-RIVER_S)<27)continue;ps.push(q);}
  const pg=new Merger();pg.add(new THREE.BoxGeometry(1.3,6,1.3),-0.6,3,0);pg.add(new THREE.BoxGeometry(1.3,6,1.3),4.6,3,0);pg.add(new THREE.BoxGeometry(9.6,0.9,1.5),2,5.55,0);
  const im=new THREE.InstancedMesh(mergeGeometries(pg.list,false),MT.deck,ps.length);const P=new THREE.Vector3(),F=new THREE.Vector3();
  ps.forEach((q,i)=>{posAt(q,P);dirAt(q,F);DUMMY.position.copy(P);DUMMY.rotation.set(0,angOf(F),0);DUMMY.scale.set(1,1,1);DUMMY.updateMatrix();im.setMatrixAt(i,DUMMY.matrix);});
  im.castShadow=im.receiveShadow=true;scene.add(im);}
const RAILP=[[-0.07,0],[-0.07,0.022],[-0.018,0.035],[-0.018,0.11],[-0.037,0.12],[-0.037,0.16],[0.037,0.16],[0.037,0.12],[0.018,0.11],[0.018,0.035],[0.07,0.022],[0.07,0]].map(([x,y])=>[x,y+RT-0.16]);
function buildTracks(){for(const lat of [0,4]){
  mesh(sweep([[-1.7,7.0],[-1.25,7.3],[1.25,7.3],[1.7,7.0]],0,L,2,lat,3.58,2.4),MT.bed,false,true);
  for(const sd of [-0.57,0.57]){mesh(sweep(RAILP,0,L,1.5,lat+sd,1,4),MT.rail,false,true);mesh(sweep([[-0.034,RT+0.002],[0.034,RT+0.002]],0,L,1.5,lat+sd,1,4),MT.railTop,false,false);}}}
const POLE0=25,POLEP=50;
const zig=s=>{const f=(s-POLE0)/POLEP,k=Math.floor(f),t=f-k;return lerp(k%2?0.2:-0.2,(k+1)%2?0.2:-0.2,t);};
const sagU=s=>((((s-POLE0)/POLEP)%1)+1)%1;
function portalGeo(cant){const m=new Merger();
  const H=(x,y0,y1)=>{const h=y1-y0,c=(y0+y1)/2;m.add(new THREE.BoxGeometry(0.3,h,0.035),x,c,0.13);m.add(new THREE.BoxGeometry(0.3,h,0.035),x,c,-0.13);m.add(new THREE.BoxGeometry(0.035,h,0.26),x,c,0);};
  if(!cant){H(-2.88,8.1,15.4);H(6.88,8.1,15.4);
    m.add(new THREE.BoxGeometry(10.1,0.12,0.12),2,15.25,0);m.add(new THREE.BoxGeometry(10.1,0.12,0.12),2,14.65,0);
    for(let i=0;i<10;i++){const x0=-3.0+i*1.0,x1=x0+1.0;cyl(m,new THREE.Vector3(x0,i%2?15.25:14.65,0),new THREE.Vector3(x1,i%2?14.65:15.25,0),0.028,5);}
    for(const tx of [0,4]){cyl(m,new THREE.Vector3(tx,14.62,0),new THREE.Vector3(tx,13.75,0),0.035,6);m.add(new THREE.CylinderGeometry(0.075,0.075,0.3,8),tx,14.15,0);}}
  else{H(6.88,8.1,15.0);cyl(m,new THREE.Vector3(6.8,14.35,0),new THREE.Vector3(-0.9,14.35,0),0.06,8);cyl(m,new THREE.Vector3(6.8,13.1,0),new THREE.Vector3(3.2,14.33,0),0.045,6);
    for(const tx of [0,4]){cyl(m,new THREE.Vector3(tx,14.32,0),new THREE.Vector3(tx,13.75,0),0.035,6);m.add(new THREE.CylinderGeometry(0.075,0.075,0.3,8),tx,14.0,0);}}
  return mergeGeometries(m.list,false);}
function buildCatenary(){const pa=[],ca=[];for(let s=POLE0;s<L;s+=POLEP){if(Math.abs(s-RIVER_S)<26)continue;(inStation(s,6)?ca:pa).push(s);}
  const P=new THREE.Vector3(),F=new THREE.Vector3();
  for(const [list,cant] of [[pa,false],[ca,true]]){if(!list.length)continue;const im=new THREE.InstancedMesh(portalGeo(cant),MT.pole,list.length);
    list.forEach((s,i)=>{posAt(s,P);dirAt(s,F);DUMMY.position.copy(P);DUMMY.rotation.set(0,angOf(F),0);DUMMY.scale.set(1,1,1);DUMMY.updateMatrix();im.setMatrixAt(i,DUMMY.matrix);});
    im.castShadow=true;scene.add(im);}
  const pts=[],A=new THREE.Vector3(),B=new THREE.Vector3(),push=()=>pts.push(A.x,A.y,A.z,B.x,B.y,B.z),st=2.5,my=u=>RT+6.1-0.45*4*u*(1-u);
  for(const tl of [0,4])for(let s=0;s<L-st;s+=st){
    frame(s,tl+zig(s),RT+5.05,A);frame(s+st,tl+zig(s+st),RT+5.05,B);push();
    frame(s,tl,my(sagU(s)),A);frame(s+st,tl,my(sagU(s+st)),B);push();
    if(Math.round(s/st)%2===0){frame(s,tl,my(sagU(s)),A);frame(s,tl+zig(s),RT+5.05,B);push();}}
  for(const fl of [-2.88,6.88])for(let s=0;s<L-5;s+=5){const f=u=>15.7-0.6*4*u*(1-u);frame(s,fl,f(sagU(s)),A);frame(s+5,fl,f(sagU(s+5)),B);push();}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const ln=new THREE.LineSegments(g,MT.wire);ln.frustumCulled=false;scene.add(ln);}
function buildSignals(){const lampG=new THREE.CylinderGeometry(0.13,0.13,0.04,16).rotateX(Math.PI/2);
  for(const s of [ST[0].stop+230,ST[1].stop-360,ST[1].stop+160,ST[2].stop-390]){const P=frame(s,-2.35,8.1),F=dirAt(s);const g=new THREE.Group();g.position.copy(P);g.rotation.y=angOf(F);scene.add(g);
    const m=new Merger();m.add(new THREE.CylinderGeometry(0.08,0.1,4.6,8),0,2.3,0);m.add(new THREE.BoxGeometry(0.62,1.55,0.1),0,4.45,0.02);m.add(new THREE.BoxGeometry(0.34,0.1,0.34),0,0.05,0);
    for(let i=0;i<3;i++)m.add(new THREE.BoxGeometry(0.34,0.05,0.2),0,5.08-i*0.45,0.15);
    const b=m.mesh(MT.sigBody);g.add(b);
    [MT.sigOff,MT.sigOff,MT.sigG].forEach((mat,i)=>{const l=new THREE.Mesh(lampG,mat);l.position.set(0,4.9-i*0.45,0.09);g.add(l);});}}
function buildStopMarkers(){const [c,x]=cv(256,320);x.fillStyle='#fff';x.fillRect(0,0,256,320);x.strokeStyle='#111';x.lineWidth=14;x.strokeRect(7,7,242,306);
  x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';x.font='900 210px Helvetica,Arial,sans-serif';x.fillText('5',128,142);x.font=`900 40px ${JPF}`;x.fillText('停止位置',128,274);
  const mat=std({map:T(c),roughness:.6}),pm=std({color:0x333,roughness:.5});
  for(const st of ST){const s=st.stop+0.8,P=frame(s,-2.05,PT),F=dirAt(s);const g=new THREE.Group();g.position.copy(P);g.rotation.y=angOf(F);scene.add(g);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1.05,8),pm);post.position.y=0.52;g.add(post);
    const bd=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.62),mat);bd.position.set(0,1.32,0.02);g.add(bd);
    const bk=new THREE.Mesh(new THREE.BoxGeometry(0.54,0.66,0.03),pm);bk.position.set(0,1.32,0);g.add(bk);}}
function buildTrack(){buildViaduct();buildTracks();buildCatenary();buildSignals();buildStopMarkers();}

// 由右半邊輪廓（由底角到車頂中間）砌成逆時針完整輪廓
function outlineFromHalf(H){const O=[{x:0,y:H[0][1],sharp:false}];for(const p of H)O.push({x:p[0],y:p[1],sharp:!!p[2]});for(let i=H.length-2;i>=0;i--)O.push({x:-H[i][0],y:H[i][1],sharp:!!H[i][2]});return O;}

function voiceFor(lang){const Lg=lang.toLowerCase(),norm=v=>v.lang.toLowerCase().replace('_','-');const ex=VOICES.filter(v=>norm(v)===Lg);
  if(Lg==='zh-hk'){const c=ex.length?ex:VOICES.filter(v=>/yue|cantonese|粵|廣東/i.test(v.name+' '+v.lang));if(c.length)return c.find(v=>/premium|enhanced|sin-?ji/i.test(v.name))||c[0];}
  if(ex.length)return ex.find(v=>/premium|enhanced/i.test(v.name))||ex[0];
  const pre=Lg.split('-')[0];return VOICES.find(v=>norm(v).startsWith(pre))||null;}

  u.rate=lang.startsWith('ja')?0.95:lang.startsWith('en')?0.85:0.92;u.pitch=lang.startsWith('zh')?1.12:1.0;
  let done=false,to=0;const fin=()=>{if(!done){done=true;clearTimeout(to);res();}};u.onend=fin;u.onerror=fin;
  to=setTimeout(fin,1500+text.length*(lang.startsWith('en')?95:280));TTS.speak(u);});}

function renderQ(q,onDone){QS={q,onDone,locked:false,found:0};const cat=CATS[q.cat];
  const card=$('#qcard');card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap');
  $('#qcat').textContent=`${cat.i} ${cat.n}`;$('#qcat').style.background=cat.c;$('#qprompt').textContent=q.prompt;$('#qsay').classList.toggle('hidden',!q.speech.some(p=>p&&p.lang&&!p.lang.startsWith('zh')));
  $('#qvis').innerHTML=q.vis;const box=$('#qopts');box.innerHTML='';box.className=q.opts.length?'n'+q.opts.length:'';
  q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.html;b.addEventListener('click',()=>answer(b,o.ok));box.appendChild(b);});

async function answer(el,ok){if(!QS||QS.locked)return;QS.locked=true;const {q,onDone}=QS;
  el.classList.add(ok?(q.find?'found':'good'):'bad');stopSpeech();$$('#qopts .opt').forEach(b=>b.disabled=true);
  if(ok){correctSfx();confetti();await sleep(300);for(const a of (q.after||[]))await say(a.t||a,a.lang||'zh-HK');await say(pick(PRAISE));}
  else{wrongSfx();await say(pick(WRONG));}
  await sleep(ok?1000:900);onDone(ok);}
function askUntilCorrect(level,cat){return new Promise(res=>{const gen=G.gen;let last=null,wrongs=0;
  const next=()=>{if(gen!==G.gen)return;let pool=(wrongs>=2?Object.keys(QT):typesOf(cat)).filter(k=>k!==last);if(!pool.length)pool=typesOf(cat);const type=pick(pool);last=type;showCard(false);
    renderQ(makeQ(type,level),ok=>{if(gen!==G.gen)return;if(ok){hideCard();res();}else{wrongs++;setTimeout(next,200);}});};next();});}
function confetti(n=70){const fx=$('#fx'),cols=['#ff5d5d','#ffd23f','#3ec1d3','#7bd389','#b388ff','#ff9f1c','#ff7eb6'];for(let i=0;i<n;i++){const p=document.createElement('i');p.className='cf';p.style.left=Math.random()*100+'%';p.style.background=pick(cols);p.style.setProperty('--dx',(Math.random()-.5)*30+'vw');p.style.setProperty('--r',(Math.random()*900-450)+'deg');p.style.animationDuration=(1.6+Math.random()*1.4)+'s';p.style.animationDelay=Math.random()*.35+'s';if(Math.random()<.4){p.style.borderRadius='50%';p.style.width=p.style.height='12px';}fx.appendChild(p);setTimeout(()=>p.remove(),3600);}}
function stampHTML(st,cls){return `<div class="stamp ${cls}"><div class="s1">JR 山手線</div><div class="s2">${st.ja}</div><div class="s3">🚃</div><div class="s4">${st.en.toUpperCase()}</div></div>`;}
async function stampFx(st){const el=$('#stampFx');el.innerHTML=stampHTML(st,'big');el.classList.remove('hidden');stampSfx();await sleep(1800);el.classList.add('hidden');}
function showBanner(st){const b=$('#banner');b.innerHTML=`<div class="bn-top"><div class="bn-num">JY<b>${st.code.slice(2)}</b></div><div class="bn-name"><div class="bn-kana">${st.kana}</div><div class="bn-ja">${st.ja}</div><div class="bn-en">${st.en}</div></div></div><div class="bn-band"><span>${st.prev?'◀ '+st.prev.ja:''}</span><span>${st.next?st.next.ja+' ▶':''}</span></div>`;
  b.classList.remove('hidden');b.style.animation='none';void b.offsetWidth;b.style.animation='';clearTimeout(b._t);b._t=setTimeout(()=>b.classList.add('hidden'),4200);}
function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms);}
function popStar(){const s=$('#stars');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');}
function initHUD(){const tr=$('#lbTrack');tr.querySelectorAll('.lbst').forEach(e=>e.remove());ST.forEach((st,i)=>{const d=document.createElement('div');d.className='lbst';d.style.left=(i/(ST.length-1)*100)+'%';d.innerHTML=`<div class="dot"></div><div class="nm">${st.ja}</div>`;tr.appendChild(d);});}
function updHUD(){let f=0;for(let i=0;i<ST.length-1;i++){if(G.s>=ST[i+1].stop){f=i+1;continue;}if(G.s>=ST[i].stop)f=i+(G.s-ST[i].stop)/(ST[i+1].stop-ST[i].stop);break;}
  const p=(f/(ST.length-1)*100).toFixed(2)+'%';$('#lbFill').style.width=p;$('#lbTrain').style.left=p;$$('.lbst').forEach((e,i)=>e.classList.toggle('done',i<=G.reached));}



/* ======================= 遊戲流程（車長玩法） ======================= */
let TA=null,TB=null;
const onc={active:false,s:0,v:18,honk:false,woosh:false};
const NOTCHES=[3,2,1,0,-1,-2,-3,-4],NL={3:'P3',2:'P2',1:'P1',0:'N','-1':'B1','-2':'B2','-3':'B3','-4':'EB'};
const NA={3:1.0,2:0.72,1:0.42,0:-0.04,'-1':-0.5,'-2':-0.85,'-3':-1.15,'-4':-1.6};
const CAM={side:13,up:6,fwd:-10,back:16,look:2.4,anchor:0};let camInit=false;
function flash(){const f=$('#fade');f.style.transition='none';f.style.opacity='1';void f.offsetWidth;f.style.transition='opacity .6s';f.style.opacity='0';}
function setCam(mode,anchor){if(G.cam===mode&&(anchor===undefined||CAM.anchor===anchor))return;const cut=G.cam!==mode;G.cam=mode;if(anchor!==undefined)CAM.anchor=anchor;if(cut){flash();camInit=false;}
  if(CAB.group)CAB.group.visible=mode==='cab';if(TA&&TA.front)TA.front.visible=mode!=='cab';camera.fov=mode==='cab'?64:50;camera.updateProjectionMatrix();G.yaw=G.pitch=0;}
function showActions(which,hot){const a=$('#actions');a.classList.toggle('hidden',!which);if(!which)return;$('#aAnn').disabled=!which.includes('ann');$('#aDoor').disabled=!which.includes('door');$('#aAnn').classList.toggle('hot',hot==='ann');$('#aDoor').classList.toggle('hot',hot==='door');}
function setDriveUI(on){for(const s of ['#mascon','#cabBtns','#drivehud'])$(s).classList.toggle('hidden',!on);}
function buildMascon(){const lab=$('#mcLabels');lab.innerHTML='';const gap=88/(NOTCHES.length-1);
  NOTCHES.forEach((n,i)=>{const d=document.createElement('div');d.className='mcl '+(n>0?'p':n===0?'n':n===-4?'eb':'b');d.style.top=(6+i*gap)+'%';d.innerHTML=`<span>${NL[n]}</span><span>${NL[n]}</span>`;lab.appendChild(d);});
  const tr=$('#mcTrack'),idxAt=y=>{const r=tr.getBoundingClientRect();return clamp(Math.round(((y-r.top)/r.height*100-6)/gap),0,NOTCHES.length-1);};let drag=false;
  tr.addEventListener('pointerdown',e=>{drag=true;tr.setPointerCapture(e.pointerId);setMascon(NOTCHES[idxAt(e.clientY)]);});
  tr.addEventListener('pointermove',e=>{if(drag)setMascon(NOTCHES[idxAt(e.clientY)]);});
  for(const ev of ['pointerup','pointercancel'])tr.addEventListener(ev,()=>{drag=false;});}
function setMascon(n,silent){if(!silent&&G.state!=='drive')return;if(n===G.notch&&!silent)return;G.notch=n;const i=NOTCHES.indexOf(n);$('#mcKnob').style.top=(6+i*(88/(NOTCHES.length-1)))+'%';$$('.mcl').forEach((d,k)=>d.classList.toggle('on',k===i));if(!silent){clickSfx();G.idleT=0;}}
function resetGame(){G.gen++;G.s=ST[0].stop;G.prevS=G.s;G.v=0;G.a=0;G.next=1;G.reached=0;G.stars=0;G.doors=1;G.doorT=1;G.tasc=G.ats=G.announced=G.annDone=G.annPrompt=false;G.idleT=0;onc.active=false;stopSpeech();
  $('#starN').textContent='0';hideCard();for(const s of ['#finish','#banner','#stampFx','#actions','#bOpen'])$(s).classList.add('hidden');setDriveUI(false);hideGuide();resetPeople();setMascon(0,true);}
function goTitle(){resetGame();SK.active=false;SK.timer=8;G.state='title';setCam('title');$('#hud').classList.add('hidden');$('#title').classList.remove('hidden');}
async function startRoute(){initAudio();initAudioExtra();unlockSpeech();resetGame();const gen=G.gen;
  $('#title').classList.add('hidden');$('#hud').classList.remove('hidden');initHUD();G.catOrder=shuffle(Object.keys(CATS));await departPrep(gen,true);}
async function departPrep(gen,first){const st=ST[G.next-1];G.state='board';G.annDone=false;G.annReady=false;setCam('platform',st.stop);G.doorT=1;
  if(first){showBanner(st);startBoarding(st,1.0);}showActions(['ann'],'ann');
  await guide(first?'你係車長！乘客上緊車，準備好就撳「發車廣播」！':'準備出發！撳「發車廣播」話俾乘客知！');}
async function onAnnDepart(){if(G.state!=='board'||G.annDone)return;const gen=G.gen;G.annDone=true;showActions([],null);hideGuide();stopSpeech();
  await annDepart(ST[G.next-1]);if(gen!==G.gen||G.state!=='board')return;const ms=departMelody();await sleep(ms*0.85);if(gen!==G.gen||G.state!=='board')return;G.annReady=true;showActions(['door'],'door');guide('好！撳「關門」！');}
async function onCloseDoor(){if(G.state!=='board'||!G.annReady)return;const gen=G.gen;G.state='closing';showActions(null);hideGuide();stopSpeech();
  say('ドアが閉まります。ご注意ください。','ja-JP');doorChime();await sleep(900);if(gen!==G.gen)return;G.doorT=0;doorSfx();await sleep(2300);if(gen!==G.gen)return;
  for(const p of PP.list)if(p.on&&p.tag==='q'+(G.next-1))p.on=false;
  setCam('cab');G.state='drive';G.tasc=G.ats=G.announced=G.annPrompt=false;G.idleT=0;setMascon(0,true);setDriveUI(true);$('#bAnn2').classList.add('hidden');spawnOncoming();SK.timer=7;
  await sleep(800);if(gen!==G.gen)return;guide('戶閉燈著咗！將控制桿推上去「P」，列車就會開動！');}
function onAnnApproach(){if(G.state!=='drive'||G.announced)return;G.announced=true;const b=$('#bAnn2');b.classList.add('hidden');b.classList.remove('hot');hideGuide();stopSpeech();annApproach(ST[G.next]);}
function arriveStop(){G.state='stopped';setMascon(-4,true);$('#bAnn2').classList.add('hidden');airSfx(1.2,0.3);$('#bOpen').classList.remove('hidden');guide('到站喇！撳「開門」！');}
async function onOpenDoor(){if(G.state!=='stopped')return;const gen=G.gen,ok=()=>gen===G.gen,idx=G.next,st=ST[idx];G.state='arrived';$('#bOpen').classList.add('hidden');hideGuide();setDriveUI(false);
  setCam('platform',st.stop);G.reached=idx;showBanner(st);await sleep(600);if(!ok())return;doorChime();G.doorT=1;doorSfx();startAlighting(st);startBoarding(st,2.6);
  await annArrive(st);if(!ok())return;await sleep(1500);if(!ok())return;
  await guide(idx>=ST.length-1?`到咗終點站${st.ja}喇！答埋最後一題！`:idx===1?`到咗${st.ja}站喇！答啱問題，列車就可以再出發！`:`到咗${st.ja}站喇！答啱問題就出發！`);if(!ok())return;
  hideGuide();await askUntilCorrect(idx,G.catOrder[(idx-1)%G.catOrder.length]);if(!ok())return;
  G.stars++;$('#starN').textContent=G.stars;popStar();await stampFx(st);if(!ok())return;
  if(idx>=ST.length-1)return finishRoute(gen);G.next=idx+1;departPrep(gen,false);}
async function finishRoute(gen){G.state='finish';fanfare();$('#fstamps').innerHTML=ST.slice(1).map(s=>stampHTML(s,'mini')).join('');$('#fstars').textContent=`⭐ × ${G.stars}`;$('#finish').classList.remove('hidden');confetti(120);
  await say('ご乗車、ありがとうございました。','ja-JP');if(gen!==G.gen)return;await say(`恭喜你！順利到達終點站${ST[ST.length-1].ja}！你係一個好叻嘅小小車長！`,'zh-HK');}
function updDrive(dt){const st=ST[G.next],rem=st.stop-G.s;
  if(!G.announced&&!G.annPrompt&&rem<470){G.annPrompt=true;const b=$('#bAnn2');b.classList.remove('hidden');b.classList.add('hot');guide('快到站喇！撳「到站廣播」話俾乘客知！');}
  if(!G.tasc&&rem<290&&G.notch<0){G.tasc=true;guide('好叻！TASC 會幫你停喺停車位置！');}
  if(!G.tasc&&rem<150){G.tasc=G.ats=true;guide('要剎車喇！自動剎車幫你停站！');}
  let a=NA[G.notch];if(G.notch>0)a*=1-Math.pow(G.v/VMAX,2);let v=clamp(G.v+a*dt,0,VMAX);
  if(G.tasc){const vt=Math.sqrt(2*0.85*Math.max(0,rem));v=Math.min(v,vt);v=Math.max(v,Math.min(vt,3.2));}
  G.s=Math.min(st.stop,G.s+(G.v+v)/2*dt);G.a=(v-G.v)/Math.max(dt,1e-3);G.v=v;
  if(G.v<0.1&&G.notch<=0&&!G.tasc){G.idleT=(G.idleT||0)+dt;if(G.idleT>10){G.idleT=0;guide('將右邊個控制桿推上去「P」，列車就會行㗎！');}}
  if(st.stop-G.s<0.03&&G.v<0.1){G.s=st.stop;G.v=0;G.a=0;arriveStop();}}
function updDriveHUD(){const st=ST[Math.min(G.next,ST.length-1)];$('#spdN').textContent=Math.round(G.v*3.6);$('#distN').textContent=Math.max(0,Math.round(st.stop-G.s));$('#distSt').textContent=st.ja;$('#tascLamp').classList.toggle('on',G.tasc);}
function spawnOncoming(){onc.active=true;onc.s=Math.min(L-110,ST[G.next].stop+160);onc.honk=false;onc.woosh=false;}
function updOnc(dt){if(!onc.active){for(const c of TB.cars)c.visible=false;return;}onc.s-=onc.v*dt;if(onc.s<-110){onc.active=false;return;}placeTrain(TB,onc.s,4,true);
  const gap=onc.s-G.s;if(!onc.honk&&gap<300&&gap>0){onc.honk=true;hornSfx();}if(!onc.woosh&&gap<14){onc.woosh=true;whoosh();}}


/* ======================= 鏡頭 ======================= */
const _h=new THREE.Vector3(),_f=new THREE.Vector3(),_cl=new THREE.Vector3(),_eye=new THREE.Vector3(),_ql=new THREE.Quaternion(),_qe=new THREE.Euler(),_sf=new THREE.Vector3(),_sp=new THREE.Vector3();
let lookDrag=null;
function updCam(dt){const t=G.time;
  if(G.cam==='cab'){const car=TA.cars[0],vf=G.v/VMAX;_eye.copy(EYE);_eye.x+=Math.sin(t*1.3)*0.008*vf;_eye.y+=Math.sin(t*2.7)*0.006*vf+(G.bump||0);
    car.updateMatrixWorld();camera.position.copy(_eye.applyMatrix4(car.matrixWorld));
    if(!lookDrag){G.yaw*=Math.exp(-dt*1.2);G.pitch*=Math.exp(-dt*1.2);}
    _qe.set(-0.07+G.pitch,G.yaw,Math.sin(t*1.1)*0.003*vf,'YXZ');_ql.setFromEuler(_qe);camera.quaternion.copy(car.quaternion).multiply(_ql);return;}
  if(G.cam==='platform'){const a=CAM.anchor;posAt(a,_h);dirAt(a,_f);const rx=-_f.z,rz=_f.x;
    camera.position.set(_h.x-rx*6.9+_f.x*5+Math.sin(t*0.3)*0.1,PT+1.5,_h.z-rz*6.9+_f.z*5);posAt(a-26,_cl);_cl.x+=rx*0.3;_cl.z+=rz*0.3;_cl.y=RT+2.35;camera.lookAt(_cl);return;}
  const a=Math.sin(t*0.05),tg={side:10,up:7.5+1.5*Math.sin(t*0.09),fwd:a*27-12,back:16,look:2.0},k=camInit?1-Math.exp(-dt*1.4):1;camInit=true;
  for(const key in tg)CAM[key]+=(tg[key]-CAM[key])*k;
  posAt(G.s,_h);dirAt(G.s,_f);const rx=-_f.z,rz=_f.x;camera.position.set(_h.x+rx*CAM.side+_f.x*CAM.fwd,RT+CAM.up,_h.z+rz*CAM.side+_f.z*CAM.fwd);posAt(G.s-CAM.back,_cl);_cl.y=RT+CAM.look;camera.lookAt(_cl);}
function updSun(){_sf.set(0,0,-1).applyQuaternion(camera.quaternion);_sp.copy(camera.position).addScaledVector(_sf,35);_sp.y=DECK;sun.target.position.copy(_sp);sun.position.copy(_sp).addScaledVector(SUN,250);sun.target.updateMatrixWorld();}

/* ======================= 主迴圈 ======================= */
let last=performance.now(),perfT=0,perfN=0,perfDone=false;
function frameLoop(now){requestAnimationFrame(frameLoop);const dt=Math.min(0.05,(now-last)/1000);last=now;G.time+=dt;
  if(G.state==='drive')updDrive(dt);
  const dd=G.doorT-G.doors;G.doors+=Math.sign(dd)*Math.min(Math.abs(dd),dt/1.6);
  placeTrain(TA,G.s,0,false);for(const m of TA.leaves)m.scale.x=Math.max(0.03,1-G.doors*0.97);
  updOnc(dt);updE5(dt);updBoats(dt);updPeople(dt);updCars(dt);texWaterN.offset.x+=dt*0.004;texWaterN.offset.y+=dt*0.012;
  if(G.v>2&&Math.floor(G.prevS/25)!==Math.floor(G.s/25)){jointClacks(G.v);G.bumpE=0.008+0.012*G.v/VMAX;}G.prevS=G.s;G.bump=(G.bumpE||0)*Math.sin(G.time*38);G.bumpE=(G.bumpE||0)*Math.exp(-dt*9);
  updCam(dt);updSun();updCab(dt);
  setTrainSound(G.v,G.a);updSqueal(G.v,G.state==='drive'&&(G.notch<0||G.tasc));
  if(G.state!=='title'&&G.state!=='loading')updHUD();if(G.state==='drive'||G.state==='stopped')updDriveHUD();
  if(G.post)composer.render();else renderer.render(scene,camera);
  if(!perfDone&&G.state==='drive'){perfT+=dt;perfN++;if(perfT>4){perfDone=true;const avg=perfT/perfN;if(avg>0.034){G.post=false;setPR(1);}else if(avg>0.024&&PR>1)setPR(1);}}}

/* ======================= 按鍵／鍵盤／拖曳望 ======================= */
$('#rJY').onclick=()=>startRoute();
$('#btnHome').onclick=()=>goTitle();
$('#btnMute').onclick=()=>{G.muted=!G.muted;$('#btnMute').textContent=G.muted?'🔇':'🔊';if(BUS)BUS.gain.value=G.muted?0:1;if(G.muted)stopSpeech();};
$('#qsay').onclick=()=>{if(QS&&!QS.locked)speakQ(QS.q);};
$('#fAgain').onclick=()=>startRoute();$('#fHome').onclick=()=>goTitle();
$('#aAnn').onclick=onAnnDepart;$('#aDoor').onclick=onCloseDoor;$('#bOpen').onclick=onOpenDoor;$('#bAnn2').onclick=onAnnApproach;
$('#bHorn').onclick=()=>{initAudio();hornSfx();};
addEventListener('keydown',e=>{if(G.state==='drive'){const i=NOTCHES.indexOf(G.notch);if(e.key==='ArrowUp'||e.key==='w')setMascon(NOTCHES[Math.max(0,i-1)]);if(e.key==='ArrowDown'||e.key==='s')setMascon(NOTCHES[Math.min(NOTCHES.length-1,i+1)]);if(e.key==='a')onAnnApproach();}
  if(e.key===' '){e.preventDefault();hornSfx();}if(e.key==='Enter'){if(G.state==='stopped')onOpenDoor();else if(G.state==='board')(G.annDone?onCloseDoor:onAnnDepart)();}});
canvas.addEventListener('pointerdown',e=>{if(G.cam!=='cab')return;lookDrag={x:e.clientX,y:e.clientY,yaw:G.yaw,pitch:G.pitch};});
addEventListener('pointermove',e=>{if(!lookDrag)return;G.yaw=clamp(lookDrag.yaw-(e.clientX-lookDrag.x)*0.004,-0.9,0.9);G.pitch=clamp(lookDrag.pitch-(e.clientY-lookDrag.y)*0.003,-0.35,0.25);});
for(const ev of ['pointerup','pointercancel'])addEventListener(ev,()=>{lookDrag=null;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let TL=1,testType=null;
function openTest(){const g=$('#tgrid');g.innerHTML='';for(const [ck,c] of Object.entries(CATS)){const h=document.createElement('div');h.className='tsec';h.textContent=`${c.i} ${c.n}`;g.appendChild(h);
  for(const k of typesOf(ck)){const b=document.createElement('button');b.style.setProperty('--c',c.c);b.textContent=QT[k][1];b.onclick=()=>runTest(k);g.appendChild(b);}}$('#test').classList.remove('hidden');}
function runTest(k){testType=k;$('#test').classList.add('hidden');$('#title').classList.add('hidden');showCard(true);const go=()=>{if(testType!==k||$('#qwrap').classList.contains('hidden'))return;renderQ(makeQ(k,TL),()=>setTimeout(go,300));};go();}
$('#btnTest').onclick=()=>{initAudio();unlockSpeech();openTest();};
$('#tClose').onclick=()=>{$('#test').classList.add('hidden');if(G.state==='title')$('#title').classList.remove('hidden');};
$('#qclose').onclick=()=>{testType=null;stopSpeech();hideCard();openTest();};
$$('.lv button').forEach(b=>b.onclick=()=>{TL=+b.dataset.l;$$('.lv button').forEach(x=>x.classList.toggle('on',x===b));});

/* ======================= 開機 ======================= */
function boot(){try{
    buildTrack();buildShinViaduct();buildStreets();buildCity();planStreetTrees();buildScenery();buildScenery2();buildTrees();buildHouses();buildStations();buildPeople();
    TA=buildTrain('e235',5);TB=buildTrain('e233',5);for(const c of TB.cars)c.visible=false;TE=buildE5(6);for(const c of TE.cars)c.visible=false;buildCab(TA.cars[0]);buildMascon();
    G.s=ST[0].stop;G.prevS=G.s;resetPeople();placeTrain(TA,G.s,0,false);G.state='title';updCam(0);updSun();renderer.compile(scene,camera);
    $('#loading').classList.add('hidden');$('#title').classList.remove('hidden');requestAnimationFrame(t=>{last=t;frameLoop(t);});
  }catch(e){console.error(e);$('#loading').innerHTML=`<div style="font-size:60px">😢</div><div>載入失敗，請重新整理</div><div style="font-size:14px;max-width:80vw;color:#a33">${e&&e.message}</div>`;}}
window.__kg={get TE(){return TE;},SK,G,ST,startRoute,goTitle,setCam,setMascon,onc,CAB,PP,renderer,camera,scene,composer,get QS(){return QS;},onAnnDepart,onCloseDoor,onOpenDoor,onAnnApproach};
setTimeout(boot,60);
