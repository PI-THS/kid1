<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小車長">
<meta name="theme-color" content="#80C241">
<title>小小車長・日本香港鐵道之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<style>

:root{--jy:#80C241;--ink:#1f2a37;--card:rgba(255,255,255,.94);--shadow:0 18px 50px rgba(15,30,50,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9cbe8;color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Hiragino Maru Gothic ProN","Noto Sans HK",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 58%,rgba(0,10,30,.28) 100%);z-index:1}
.hidden{display:none!important}
.num,.word,.tile{font-family:"Baloo 2","Arial Rounded MT Bold","PingFang HK",sans-serif}

/* 載入 */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#bfe0ff,#eaf6ff);font-size:26px;font-weight:800;z-index:60}
#loading .ld-train{font-size:84px;animation:chug .6s ease-in-out infinite alternate}
@keyframes chug{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}

/* 主頁 */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:24px;z-index:10;
  background:linear-gradient(rgba(10,30,60,.35),rgba(10,30,60,0) 45%,rgba(10,30,60,.25))}
.logo{text-align:center;color:#fff;text-shadow:0 4px 18px rgba(0,40,80,.5)}
.logo .l1{font-size:min(13vw,100px);font-weight:900;letter-spacing:.1em;line-height:1.05}
.logo .l2{font-size:min(5vw,34px);font-weight:800;margin-top:8px}
.routes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;width:min(96vw,1040px)}
@media (max-aspect-ratio:1/1){.routes{grid-template-columns:repeat(2,1fr)}}
.route{position:relative;border:none;border-radius:28px;background:var(--card);padding:18px 12px 16px;text-align:center;box-shadow:var(--shadow),inset 0 -6px 0 rgba(0,0,0,.06);transition:transform .15s}
.route:active{transform:scale(.96)}
.route .rc{width:80px;height:80px;margin:0 auto 10px;border-radius:50%;border:10px solid var(--c);display:flex;align-items:center;justify-content:center;font:800 26px "Baloo 2",sans-serif;color:#222;background:#fff}
.route .rn{font-size:27px;font-weight:900}
.route .re{font-size:14px;opacity:.6;font-weight:700}
.route .rs{margin-top:10px;font-size:16px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:7px 12px;display:inline-block}
.route.locked{filter:grayscale(.55);opacity:.75}
.route.locked .rs{background:#8a96a3}
.route .lock{position:absolute;top:10px;right:14px;font-size:22px}
.go{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.small{border:none;background:rgba(255,255,255,.85);border-radius:99px;padding:11px 22px;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;z-index:8;pointer-events:none}
#hud>*{pointer-events:auto}
.hbtn{flex:none;width:62px;height:62px;border:none;border-radius:20px;background:var(--card);font-size:30px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#lineBar{flex:1;display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:8px 36px 8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:62px}
.lb-badge{flex:none;width:46px;height:46px;border-radius:50%;border:6px solid var(--jy);display:flex;align-items:center;justify-content:center;font:800 15px "Baloo 2",sans-serif;background:#fff}
#lbTrack{position:relative;flex:1;height:46px}
#lbTrack .rail{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:9px;background:#dfe7d6}
#lbFill{position:absolute;left:0;top:13px;height:8px;border-radius:9px;background:var(--jy);width:0}
.lbst{position:absolute;top:7px;transform:translateX(-50%);text-align:center}
.lbst .dot{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--jy);margin:0 auto}
.lbst .nm{font-size:14px;font-weight:900;white-space:nowrap;margin-top:1px}
.lbst.done .dot{background:var(--jy)}
#lbTrain{position:absolute;top:-10px;font-size:30px;transform:translateX(-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
#stars{flex:none;background:var(--card);border-radius:20px;height:62px;padding:0 18px;display:flex;align-items:center;gap:6px;font:800 30px "Baloo 2",sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#stars.pop{animation:starpop .6s}
@keyframes starpop{40%{transform:scale(1.35) rotate(-8deg)}}

/* 站名牌 */
#banner{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:min(560px,86vw);background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:7;animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-170%)}to{transform:translate(-50%,0)}}
.bn-top{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 16px 6px}
.bn-num{width:64px;height:64px;border:6px solid var(--jy);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 17px/1 "Baloo 2",sans-serif}
.bn-num b{font-size:25px}
.bn-name{text-align:center}
.bn-kana{font-size:18px;font-weight:700;color:#444}
.bn-ja{font-size:54px;font-weight:900;line-height:1.05;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
.bn-en{font:700 20px "Baloo 2",sans-serif;color:#333}
.bn-band{display:flex;justify-content:space-between;background:var(--jy);color:#fff;font-weight:800;padding:8px 16px;font-size:18px;min-height:40px}

/* 問題卡 */
#qwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:88px 16px 16px;background:linear-gradient(rgba(8,20,35,0),rgba(8,20,35,.35));perspective:1400px}
#qcard{position:relative;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:1.8vh;background:var(--card);border-radius:36px;padding:22px 26px 26px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#qcard.swap{animation:swap .5s ease}
@keyframes swap{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
#qhead{display:flex;align-items:center;gap:14px}
#qcat{flex:none;color:#fff;font-weight:900;font-size:20px;padding:8px 16px;border-radius:99px}
#qprompt{flex:1;font-size:min(4.2vh,30px);font-weight:900;line-height:1.25}
#qsay{flex:none;width:66px;height:66px;border:none;border-radius:50%;background:#fff3c4;font-size:32px;box-shadow:0 5px 0 #e8cf72}
#qsay:active{transform:translateY(4px);box-shadow:0 1px 0 #e8cf72}
#qclose{position:absolute;top:-14px;right:-14px;width:56px;height:56px;border:none;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:2}
#qvis{min-height:28vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;text-align:center}
#qopts{display:grid;gap:18px}
#qopts.n2{grid-template-columns:1fr 1fr}
#qopts.n3{grid-template-columns:repeat(3,1fr)}
#qopts.n4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:min(21vh,170px);border:6px solid #e3e9f0;border-radius:30px;background:#fff;box-shadow:0 9px 0 #cfd8e2;font-size:min(10vh,76px);font-weight:900;display:flex;align-items:center;justify-content:center;padding:8px;transition:transform .08s}
.opt:active{transform:translateY(6px);box-shadow:0 3px 0 #cfd8e2}
.opt:disabled{opacity:.7}
.opt.good{background:#d8f8d2;border-color:#43b649;box-shadow:0 9px 0 #2f8f35;animation:bounce .5s;opacity:1}
.opt.bad{background:#ffe0e0;border-color:#f06464;box-shadow:0 9px 0 #c44;animation:shake .45s;opacity:1}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes bounce{40%{transform:scale(1.12)}}
.pic{font-size:min(23vh,200px);line-height:1.1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.18))}
.pic.sm{font-size:min(15vh,130px)}
.pic.shadow{filter:brightness(0) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.eq{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:linear-gradient(#f5f9ff,#e4eefb);border:4px solid #c9d8ee;border-radius:24px;padding:10px 12px}
.grp span{font-size:var(--es,54px);line-height:1.1;display:inline-block}
.grp span.gone{opacity:.25;filter:grayscale(1)}
.op{font:800 60px "Baloo 2",sans-serif;color:#2f7fe0}
.eqtxt{width:100%;font:800 min(8vh,60px) "Baloo 2",sans-serif;letter-spacing:.06em;color:#253548}
.tiles{display:flex;gap:10px;justify-content:center;width:100%}
.tile{min-width:min(10vh,78px);height:min(11vh,86px);border-radius:16px;background:#fff;border:4px solid #c8d3e0;font-size:min(8vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #c8d3e0;padding:0 6px}
.tile.zh{font-family:"PingFang HK",sans-serif;font-weight:700}
.tile.blank{background:#fff7d1;border-color:#f0c02e;border-style:dashed;color:#e0a500;animation:blink 1.2s infinite}
@keyframes blink{50%{background:#ffe98a}}
.word{font-size:min(7vh,52px);letter-spacing:.04em}
.zh{font-size:min(8vh,58px);font-weight:800}
.emo{font-size:min(12vh,92px);line-height:1}
.riddle{display:flex;align-items:center;gap:20px;max-width:780px;text-align:left}
.riddle .rq{font-size:min(15vh,116px)}
.riddle .rt{font-size:min(4.6vh,34px);font-weight:900;line-height:1.5;background:#fff8e1;border-radius:24px;padding:16px 22px;border:4px dashed #f3c14b}
.rebus{display:flex;align-items:center;gap:14px;font-size:min(15vh,116px)}
.rebus b{font:800 min(9vh,70px) "Baloo 2",sans-serif;color:#f08a24}
.rebus .qm{display:inline-flex;width:1.1em;height:1.1em;border-radius:24px;background:#fff7d1;border:5px dashed #f0c02e;align-items:center;justify-content:center;font-size:.7em}
.zoomwrap{position:relative;padding:10px 40px 40px 10px}
.zoomwin{position:relative;width:min(29vh,250px);height:min(29vh,250px);border-radius:50%;overflow:hidden;background:#fff;border:14px solid #3c4650;box-shadow:inset 0 0 30px rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.25)}
.zoomwin span{position:absolute;left:50%;top:50%;line-height:1}
.zoomwrap::after{content:"";position:absolute;width:26px;height:100px;background:linear-gradient(90deg,#6b4b2a,#8b6236);border-radius:14px;right:22px;bottom:-24px;transform:rotate(-45deg)}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq span{font-size:min(9vh,70px);background:#fff;border-radius:20px;padding:6px 10px;border:4px solid #e3e9f0;line-height:1.15}
.seq span.q{background:#fff7d1;border:4px dashed #f0c02e;min-width:1.4em}
.hint{font-size:min(5vh,36px);font-weight:900;color:#445}
.bigword{font-size:min(9vh,68px);font-weight:900}
.findgrid{display:grid;gap:6px;width:min(100%,760px);background:linear-gradient(#caa57a,#a97d4f);padding:12px;border-radius:24px;box-shadow:inset 0 0 0 6px #8a6238}
.fcell{border:none;background:rgba(255,255,255,.18);border-radius:16px;font-size:min(8.5vh,64px);padding:4px;line-height:1.2}
.fcell.found{background:#d8f8d2;box-shadow:0 0 0 5px #43b649 inset}
.fcell.bad{background:#ffd3d3;animation:shake .45s}
.optgrp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;font-size:min(8vh,60px);line-height:1.15;max-width:92%}

/* 彩紙、印章、完成 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf{position:absolute;top:-4vh;width:12px;height:20px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
#stampFx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;background:rgba(255,255,255,.15)}
.stamp{width:230px;height:230px;border-radius:50%;border:10px solid #d6263b;color:#d6263b;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,250,245,.95);box-shadow:0 0 0 5px rgba(255,250,245,.95),0 0 0 9px #d6263b;transform:rotate(-12deg);font-weight:900}
.stamp .s1{font-size:17px;letter-spacing:.2em}
.stamp .s2{font-size:64px;line-height:1.05;font-family:"Hiragino Mincho ProN","Songti TC",serif}
.stamp .s3{font-size:40px;line-height:1.1}
.stamp .s4{font:800 17px "Baloo 2",sans-serif;letter-spacing:.15em}
.stamp.big{animation:stampIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{from{transform:scale(2.6) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.stamp.mini{width:150px;height:150px;border-width:7px;box-shadow:0 0 0 4px #fff,0 0 0 7px #d6263b}
.stamp.mini .s2{font-size:40px}.stamp.mini .s3{font-size:24px}.stamp.mini .s1,.stamp.mini .s4{font-size:12px}
#finish{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(8,20,35,.35);padding:20px}
.fcard{background:var(--card);border-radius:40px;padding:30px 34px;text-align:center;box-shadow:var(--shadow);width:min(760px,100%);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.fcard h1{margin:0;font-size:min(8vh,54px)}
.fcard p{font-size:24px;font-weight:800;margin:10px 0 16px}
.stamps{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
.bigbtn{border:none;border-radius:24px;padding:18px 30px;font-size:27px;font-weight:900;color:#fff;background:var(--jy);box-shadow:0 8px 0 #5c9a2c;margin:6px 8px}
.bigbtn.alt{background:#5b8def;box-shadow:0 8px 0 #3d68c2}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,30,45,.82);color:#fff;font-size:24px;font-weight:800;padding:14px 26px;border-radius:99px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* 家長試玩 */
#test{position:fixed;inset:0;z-index:18;background:rgba(8,20,35,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.tcard{background:#fff;border-radius:32px;padding:24px;width:min(900px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.tcard h2{margin:0;font-size:30px}
.tcard .lv{display:flex;gap:10px;margin:14px 0 16px;align-items:center;font-weight:800;font-size:20px}
.tcard .lv button{border:none;border-radius:14px;padding:10px 18px;font-size:19px;font-weight:900;background:#eef2f7}
.tcard .lv button.on{background:var(--jy);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tgrid button{border:none;border-radius:18px;padding:15px 12px;font-size:19px;font-weight:800;background:#f4f7fb;border-left:8px solid var(--c);text-align:left}
.tsec{grid-column:1/-1;font-weight:900;font-size:18px;margin-top:8px;color:#556}

/* ===== v5：RUNNING TRAIN 式介面（深色半透明細框）＋線條圖示，全遊戲冇 emoji ===== */
#vig{display:none}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none;fill:currentColor;overflow:visible}
.glass{background:rgba(12,17,24,.64);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.logo .l3{font-size:min(3.4vw,22px);font-weight:800;margin-top:10px;background:rgba(0,0,0,.28);display:inline-block;padding:6px 16px;border-radius:99px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
#loading .ld-train{color:#2f5e1c}
.route .lock{color:#5d6770}
.route .rgo{display:inline-flex;align-items:center;gap:4px;margin-left:10px;padding-left:10px;border-left:2px solid rgba(255,255,255,.5)}
.small{display:inline-flex;align-items:center;gap:8px}
.small .ic{font-size:1.15em}

/* ---- 頂部：次站卡＋路線條 ---- */
#hud{position:fixed;left:0;right:0;top:0;z-index:8;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:8px}
.hrow>*{min-width:0}
.gbtn{flex:none;width:52px;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(12,17,24,.64);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.gbtn:active{transform:scale(.94)}
#nextBox{flex:1;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 7px}
.nb-code{flex:none;width:40px;height:40px;border:4px solid var(--jy);border-radius:8px;background:#fff;color:#1d1d1d;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 10px/1 "Baloo 2",sans-serif}
.nb-code b{font-size:17px;line-height:.95}
.nb-txt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.nb-txt small{font-size:13px;color:#8fd3ff;font-weight:800}
.nb-txt b{font-size:25px;font-weight:900;font-family:"Hiragino Sans","PingFang HK",sans-serif;letter-spacing:.04em}
.nb-txt span{font:700 15px "Baloo 2",sans-serif;color:rgba(255,255,255,.62);overflow:hidden;text-overflow:ellipsis}
#nbDist{flex:none;display:flex;align-items:center;gap:6px}
.nb-ring{width:30px;height:30px;transform:rotate(-90deg)}
.nb-ring circle{fill:none;stroke-width:5}
.nb-ring .bg{stroke:rgba(255,255,255,.18)}
.nb-ring .fg{stroke:#ffd24a;stroke-linecap:round;stroke-dasharray:0 100}
.nb-m b{font:800 24px "Baloo 2",sans-serif;color:#ffd24a}
.nb-m small{font-size:12px;color:rgba(255,255,255,.7);margin-left:2px}
#hud #stars,#hud #lineBar{background:rgba(12,17,24,.64);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#hud #stars{flex:none;height:52px;padding:0 12px;display:flex;align-items:center;gap:6px;font:800 24px "Baloo 2",sans-serif}
#hud #stars .ic{color:#ffd24a;font-size:24px}
#hud #lineBar{display:block;min-height:0;padding:8px 34px 4px}
#hud #lbTrack{position:relative;height:36px}
#hud #lbTrack .rail{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
#hud #lbFill{position:absolute;left:0;top:9px;height:6px;border-radius:6px;background:var(--jy);box-shadow:0 0 10px rgba(128,194,65,.6)}

.dbtn .ic{font-size:clamp(28px,7vw,40px)}
.dbtn .dt{font-size:clamp(14px,3.8vw,18px);letter-spacing:.06em}
.dbtn.brake{background:radial-gradient(circle at 35% 28%,#ffb25e,#e0661a 70%)}
.dbtn.power{background:radial-gradient(circle at 35% 28%,#7cc0ff,#1f6fd6 70%)}
.dbtn:active,.dbtn.on{transform:scale(.94);filter:brightness(1.1)}
#dMid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px}

#dGauge svg{width:100%;height:100%;transform:rotate(135deg);overflow:visible}
#dGauge circle{fill:none;stroke-width:9}
#dGauge .g-track{stroke:rgba(255,255,255,.14);stroke-dasharray:75 100}
#dGauge .g-red{stroke:#ff4d4d;stroke-width:4;stroke-dasharray:0 50 25 25}
#dGauge .g-arc{stroke:#ff9a2e;stroke-dasharray:0 100;stroke-linecap:round}
#gTicks line{stroke:rgba(255,255,255,.6);stroke-width:1.8}
.gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
.gv b{font:800 clamp(28px,7.5vw,40px)/.9 "Baloo 2",sans-serif}
.gv small{font-size:11px;color:rgba(255,255,255,.65)}
.dm-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#notchBar{display:flex;gap:3px;background:rgba(0,0,0,.35);border-radius:10px;padding:4px;touch-action:none}
.nt{flex:1;min-width:0;height:clamp(28px,7vw,36px);border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 clamp(11px,2.9vw,14px) "Baloo 2",sans-serif;color:rgba(255,255,255,.45);background:rgba(255,255,255,.06);transition:background .12s}
.nt.lit.p{background:rgba(43,127,224,.45);color:#fff}.nt.lit.b,.nt.lit.eb{background:rgba(224,112,26,.45);color:#fff}
.nt.on.p{background:#2b7fe0;color:#fff}.nt.on.n{background:#f2f2f2;color:#222}.nt.on.b{background:#e0701a;color:#fff}.nt.on.eb{background:#d83a3a;color:#fff}
.lamps{display:flex;gap:6px;flex-wrap:wrap}
.lamps span{font:800 11px "Baloo 2","Hiragino Sans",sans-serif;letter-spacing:.08em;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.lamps span.on{background:#1f9d55;color:#fff;box-shadow:0 0 12px rgba(31,157,85,.8)}
.lamps #atsLamp.on{background:#c62828;box-shadow:0 0 12px rgba(198,40,40,.8)}
.lamps #doorLamp.on{background:#e08a1a;box-shadow:0 0 12px rgba(224,138,26,.8)}
#cabBtns{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + clamp(124px,30vw,168px));z-index:9;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.cbtn{height:56px;min-width:56px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(12,17,24,.66);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.cbtn.wide{padding:0 18px;font-size:clamp(17px,4.4vw,21px);font-weight:900}
.cbtn.wide .ic{font-size:24px}

.cbtn.hot{background:linear-gradient(#9ad65a,#6fb33a);color:#0f2a07;border-color:rgba(255,255,255,.7);animation:hot 1s ease-in-out infinite}

/* ---- 月台動作按鈕 ---- */
#actions{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:9;display:flex;gap:14px;width:min(94vw,620px)}
.act,#bOpen{border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:10px 18px 10px 10px;background:rgba(12,17,24,.72);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900}
.act{flex:1;min-width:0}
.ai{flex:none;width:clamp(48px,12vw,62px);height:clamp(48px,12vw,62px);border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,36px)}
.at{font-size:clamp(20px,5.2vw,28px);white-space:nowrap;letter-spacing:.04em}

#bOpen{position:fixed;left:0;right:0;margin:0 auto;width:max-content;min-width:min(70vw,300px);bottom:calc(env(safe-area-inset-bottom) + clamp(140px,32vw,184px));z-index:10}

/* ---- 車長提示（字幕式） ---- */

.k.p{background:#1f6fd6}.k.b{background:#e0661a}.k.g{background:#5a9e2f}

/* ---- 題目 ---- */

#qprog i.done{background:#43b649}#qprog i.cur{background:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.35)}
#qcat{display:inline-flex;align-items:center;gap:6px}#qcat .ic{font-size:1.1em}
#qsay{display:flex;align-items:center;justify-content:center;color:#6b5200;font-size:32px}
#qclose{display:flex;align-items:center;justify-content:center;font-size:24px}
.ico{display:inline-block;width:1.15em;height:1.15em;object-fit:contain;vertical-align:middle;-webkit-user-drag:none;pointer-events:none}
.qbub{display:inline-flex;align-items:center;justify-content:center;width:1.05em;height:1.05em;border-radius:50%;background:#fff3c4;border:.05em solid #f0c02e;color:#e0a500;font:800 .72em/1 "Baloo 2",sans-serif;box-shadow:0 .06em 0 #e8cf72}
.fcell .ico{width:1.18em;height:1.18em}.seq span .ico{width:1.3em;height:1.3em}.optgrp .ico{width:1.1em;height:1.1em}.grp .ico{width:1.2em;height:1.2em}
.pic .ico{width:1.2em;height:1.2em}.rebus .ico{width:1.15em;height:1.15em}.opt .emo .ico{width:1.6em;height:1.6em}
.op .ic{display:block}
.qm-box{display:inline-flex;align-items:center;justify-content:center;font:800 .62em "Baloo 2",sans-serif;color:#e0a500}
.swatch{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.12em;margin-right:.25em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.2)}
#qopts.n2{grid-template-columns:repeat(2,minmax(0,1fr))}#qopts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}#qopts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.opt{min-width:0}
/* 直向手機：題目內容按畫面闊度縮放，唔好凸出卡外 */
@media (max-aspect-ratio:3/4){#qcard{padding:16px 14px 18px;border-radius:28px;gap:1.4vh}#qprompt{font-size:20px}#qcat{font-size:15px;padding:6px 10px}
  #qvis{min-height:22vh;gap:8px}#qopts{gap:10px}#qopts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt{min-height:min(15vh,150px);border-width:4px;border-radius:22px;padding:4px;box-shadow:0 7px 0 #cfd8e2;font-size:min(10vh,76px,13vw)}

  .seq{gap:6px}.seq span{font-size:min(9vh,70px,10vw);padding:4px 6px;border-radius:14px;border-width:3px}
  .riddle{flex-direction:column;gap:10px;text-align:center}.riddle .rq{font-size:min(15vh,116px,26vw)}.riddle .rt{font-size:min(4.6vh,34px,5.4vw);padding:10px 14px}

#banner{top:calc(env(safe-area-inset-top) + 178px);width:min(460px,84vw)}

@media (max-width:480px){.nb-ring{display:none!important}.nb-txt span,.nb-txt small{display:none}.nb-txt b{font-size:22px;flex:none}#nextBox{gap:8px;padding:0 10px 0 6px}.nb-code{width:36px;height:36px}#hud #stars{padding:0 9px;font-size:20px}.nb-m b{font-size:21px}.nb-ring{width:24px;height:24px}#banner{top:calc(env(safe-area-inset-top) + 200px)}}

@media (min-aspect-ratio:1/1){#deck{background:none;padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(16px,env(safe-area-inset-left))}

const LMM={v:std({vertexColors:true,roughness:.72,metalness:.04}),glass:std({vertexColors:true,roughness:.12,metalness:.62,envMapIntensity:1.2}),lamp:new THREE.MeshBasicMaterial({vertexColors:true})};

function lmNew(){const c={g:new THREE.Group(),M:{},anim:[],occ:[],noOcc:false};c.mg=k=>c.M[k]||(c.M[k]=new Merger(true));return c;}
const lmOcc=(c,x0,x1,z0,z1)=>{if(!c.noOcc)c.occ.push([Math.min(x0,x1),Math.max(x0,x1),Math.min(z0,z1),Math.max(z0,z1)]);};
const lmBoxR=(c,k,x,y,z,w,h,d,col,rx=0,ry=0,rz=0)=>{const cs=Math.abs(Math.cos(ry)),sn=Math.abs(Math.sin(ry)),ex=(w*cs+d*sn)/2,ez=(w*sn+d*cs)/2;lmOcc(c,x-ex,x+ex,z-ez,z+ez);c.mg(k).add(new THREE.BoxGeometry(w,h,d),x,y,z,rx,ry,rz,1,col);};
const lmBox=(c,x,z,w,h,d,col,y=0,ry=0,k='v')=>lmBoxR(c,k,x,y+h/2,z,w,h,d,col,0,ry,0);
const lmCyl=(c,x,y,z,rt,rb,h,col,seg=16,k='v')=>{const r=Math.max(rt,rb);lmOcc(c,x-r,x+r,z-r,z+r);c.mg(k).add(new THREE.CylinderGeometry(rt,rb,h,seg),x,y+h/2,z,0,0,0,1,col);};
const lmSph=(c,x,y,z,r,col,s=1,k='v')=>{const S=Array.isArray(s)?s:[s,s,s];lmOcc(c,x-r*S[0],x+r*S[0],z-r*S[2],z+r*S[2]);c.mg(k).add(new THREE.SphereGeometry(r,16,12),x,y,z,0,0,0,s,col);};
const lmBar=(c,a,b,r,col,seg=6)=>cyl(c.mg('v'),new THREE.Vector3(...a),new THREE.Vector3(...b),r,seg,col);
function lmOccLine(c,a,b,r){const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/r);for(let i=0;i<=n;i++){const x=a[0]+(b[0]-a[0])*i/n,z=a[1]+(b[1]-a[1])*i/n;lmOcc(c,x-r,x+r,z-r,z+r);}}
function lmGround(c,col,x0=25,x1=125,z0=-110,z1=90){c.noOcc=true;lmBox(c,(x0+x1)/2,(z0+z1)/2,x1-x0,0.12,z1-z0,col,0.03);c.noOcc=false;}
function lmTree(c,x,z,s=1,col=0x4c9a3b){lmCyl(c,x,0,z,0.28*s,0.42*s,3.4*s,0x6b4a2e,6);for(const [dx,dy,dz,r] of [[0,5,0,2.6],[1.4,4.3,0.6,1.8],[-1.3,4.4,-0.5,1.9],[0.3,6.4,-0.3,1.7]])lmSph(c,x+dx*s,dy*s,z+dz*s,r*s,col);}
const SKR=[0xf6b3c8,0xf9c6d6,0xf29bb8,0xfadbe4];
function lmSakura(c,x,z,s=1){lmTree(c,x,z,s,SKR[Math.floor(Math.random()*SKR.length)]);}
function lmTower(c,x,z,w,d,h,kind=1){c.bgUsed=true;lmOcc(c,x-d/2,x+d/2,z-w/2,z+w/2);bx('LMf'+kind,x,z,0,w,d,0,h,14.4,13.6,Math.floor(Math.random()*4)*0.25,0,new THREE.Color(sr(.9,1),sr(.9,1),sr(.9,1)),'LMroof');}
function lmSign(c,t,fg,bg,x,y,z,w,h,vert=false,ry=-Math.PI/2){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:boardTex(t,fg,bg,vert),color:HDR(0xffffff,1.25)}));m.position.set(x,y,z);m.rotation.y=ry;c.g.add(m);return m;}
function lmTexPlane(c,tex,x,y,z,w,h,ry=-Math.PI/2,k=1.2){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,color:HDR(0xffffff,k)}));m.position.set(x,y,z);m.rotation.y=ry;c.g.add(m);return m;}
function lmWater(c,x0,x1,z0,z1){lmOcc(c,x0,x1,z0,z1);const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),WATER);m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2,0.3,(z0+z1)/2);c.g.add(m);}

function lmRoof(c,x,y,z,d,w,h,col){const s=new THREE.Shape();s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(0,h);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});g.translate(0,0,-w/2);c.mg('v').add(g,x,y,z,0,0,0,1,col);}

  lmBoxR(c,'v',x,h-0.5*s,z,1.3*s,0.6*s,13.6*s,col);lmBoxR(c,'v',x,h-2.3*s,z,0.9*s,0.7*s,12*s,col);lmBox(c,x,z,0.5*s,1.8*s,0.8*s,col,h-2.3*s);}
function lmHall(c,x,z,s,pil=0xd6452f,wall=0xf3efe6,rf=0x3f4a4f){const W=18*s,D=14*s;lmBox(c,x,z,D+4*s,1.2*s,W+4*s,0xb8b2a6);for(const dx of [-1,1])for(const dz of [-1,-0.33,0.33,1])lmCyl(c,x+dx*D*0.45,1.2*s,z+dz*W*0.45,0.45*s,0.45*s,6*s,pil,10);

function lmTrainGroup(n,len,w,h,body,band,band2,mono=false){const c=lmNew();for(let i=0;i<n;i++){const z=i*(len+0.6)-(n-1)*(len+0.6)/2;lmBox(c,0,z,w,h,len,body,0);lmBox(c,0,z,w+0.02,h*0.28,len*0.92,0x1d2a36,h*0.5);lmBox(c,0,z,w+0.04,0.3,len,band,h*0.36);if(band2)lmBox(c,0,z,w+0.04,0.18,len,band2,h*0.3);}

function lmShinkansen(c,x,z0,n,kind){const [body,top,band]=kind==='e5'?[0xf4f6f7,0x1f8a5a,0xe8588f]:kind==='e7'?[0xf4f6f7,0x2a4d9a,0xb87333]:[0xf7f8f9,0xf7f8f9,0x1e5aa8];const L=25;
  for(let i=0;i<n;i++){const z=z0+i*(L+1);lmBox(c,x,z,3.4,2.3,L,body,0.6);lmBox(c,x,z,3.4,1.2,L,top,2.9);lmBox(c,x,z,3.42,0.32,L,band,2.75);lmBoxR(c,'v',x,2.25,z,3.44,0.6,L*0.9,0x1d2a36);}
  const g=new THREE.SphereGeometry(1,20,12);g.scale(1.7,1.5,kind==='n700'?7:9);c.mg('v').add(g,x,2.3,z0-L/2-(kind==='n700'?4:6),0,0,0,1,body);}
// ⚠ 城市大廈（BG 'LM…'）只有用過 lmTower 嗰個先收；唔係車／船呢啲內層組會偷咗外層未收嘅大廈，大廈會跟住火車一齊郁
function lmFinish(c){for(const k in c.M){const o=c.M[k].mesh(LMM[k]||LMM.v,false,true);if(o)c.g.add(o);}
  if(c.bgUsed)for(const k of Object.keys(BG)){if(!k.startsWith('LM'))continue;const A=BG[k],g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(A.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(A.n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(A.u,2));g.setAttribute('color',new THREE.Float32BufferAttribute(A.c,3));
    const m=new THREE.Mesh(g,k==='LMroof'?MC.roof:(FACM[+k.slice(3)]||FACM[0]));m.receiveShadow=true;c.g.add(m);delete BG[k];}
  c.g.userData.anim=c.anim;return c.g;}
function screenTex(t='TOKYO'){const [cc,x]=cv(256,144);const g=x.createLinearGradient(0,0,256,144);g.addColorStop(0,'#ff4081');g.addColorStop(.5,'#7c4dff');g.addColorStop(1,'#00e5ff');x.fillStyle=g;x.fillRect(0,0,256,144);x.fillStyle='rgba(255,255,255,.9)';x.font=`900 44px ${JPF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,76,236);return T(cc);}
function latticeTex(){const [cc,x]=cv(256,256);x.fillStyle='#35607e';x.fillRect(0,0,256,256);x.strokeStyle='#f4f6f7';x.lineWidth=10;for(let i=-4;i<8;i++){x.beginPath();x.moveTo(i*48,0);x.lineTo(i*48+256,256);x.stroke();x.beginPath();x.moveTo(i*48+256,0);x.lineTo(i*48,256);x.stroke();}const t=T(cc,1);t.repeat.set(4,6);return t;}
function crossTex(){const [cc,x]=cv(512,512);x.fillStyle='#3a3a3c';x.fillRect(0,0,512,512);x.fillStyle='#f2f2f0';for(let i=0;i<14;i++){x.fillRect(100+i*22,34,11,58);x.fillRect(100+i*22,420,11,58);x.fillRect(34,100+i*22,58,11);x.fillRect(420,100+i*22,58,11);}
  x.save();x.translate(256,256);for(const r of [Math.PI/4,-Math.PI/4]){x.save();x.rotate(r);for(let i=-6;i<=6;i++)x.fillRect(-150,i*20-5,300,10);x.restore();}x.restore();return T(cc);}
function tudorTex(){const [cc,x]=cv(256,128);x.fillStyle='#f6f1e6';x.fillRect(0,0,256,128);x.strokeStyle='#4e342e';x.lineWidth=7;for(let i=0;i<=8;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,128);x.stroke();}x.beginPath();x.moveTo(0,64);x.lineTo(256,64);x.stroke();
  for(let i=0;i<8;i+=2){x.beginPath();x.moveTo(i*32,64);x.lineTo(i*32+32,0);x.stroke();x.beginPath();x.moveTo(i*32+32,128);x.lineTo(i*32+64,64);x.stroke();}return T(cc,1);}

const PRAISE=['答啱喇！好叻呀！','好犀利呀！','完全正確！叻叻！','好嘢！你真係好叻！','啱晒！拍拍手！'];
const WRONG=['唔緊要，我哋試下另一題！','差少少啫，再嚟過！','唔啱呀，試下下一題！'];
let QS=null;
function showCard(test){$('#qwrap').classList.remove('hidden');$('#qclose').classList.toggle('hidden',!test);}
function hideCard(){$('#qwrap').classList.add('hidden');QS=null;}
function renderQ(q,onDone){QS={q,onDone,locked:false,found:0};const cat=CATS[q.cat];
  const card=$('#qcard');card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap');
  $('#qcat').innerHTML=`${IC(cat.i)}${cat.n}`;$('#qcat').style.background=cat.c;$('#qprompt').textContent=q.prompt;$('#qsay').classList.toggle('hidden',!q.speech.some(p=>p&&p.lang&&!p.lang.startsWith('zh')));
  $('#qvis').innerHTML=q.vis;const box=$('#qopts');box.innerHTML='';box.className=q.opts.length?'n'+q.opts.length:'';
  q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.html;b.addEventListener('click',()=>answer(b,o.ok));box.appendChild(b);});
  if(q.find)$$('#qvis .fcell').forEach(c=>c.addEventListener('click',()=>{if(!QS||QS.locked||c.classList.contains('found'))return;if(c.dataset.ok==='1'){c.classList.add('found');blip();if(++QS.found>=q.find)answer(c,true);}else answer(c,false);}));
  speakQ(q);}
async function speakQ(q){stopSpeech();await sleep(140);const my=QS;for(const p of q.speech){if(QS!==my||!my||my.locked)return;await say(p.t||p,p.lang||'zh-HK');}}
async function answer(el,ok){if(!QS||QS.locked)return;QS.locked=true;const {q,onDone}=QS;
  el.classList.add(ok?(q.find?'found':'good'):'bad');stopSpeech();$$('#qopts .opt').forEach(b=>b.disabled=true);
  if(ok){correctSfx();confetti();await sleep(300);for(const a of (q.after||[]))await say(a.t||a,a.lang||'zh-HK');await say(pick(PRAISE));}
  else{wrongSfx();await say(pick(WRONG));}
  await sleep(ok?1000:900);onDone(ok);}
// 同一科一直出到答啱為止；答錯兩次就降一級，唔會轉去第二科（每站四科各 2 題要數得啱）；同一個站盡量唔重複題型
function askUntilCorrect(level,cat,used=new Set()){return new Promise(res=>{const gen=G.gen;let last=null,wrongs=0;
  const next=()=>{if(gen!==G.gen)return;const all=typesOf(cat);let pool=all.filter(k=>k!==last&&!used.has(k));if(!pool.length)pool=all.filter(k=>k!==last);if(!pool.length)pool=all;const type=pick(pool);last=type;used.add(type);showCard(false);
    renderQ(makeQ(type,wrongs>=2?Math.max(1,level-1):level),ok=>{if(gen!==G.gen)return;if(ok){hideCard();res();}else{wrongs++;setTimeout(next,200);}});};next();});}

function updOnc(dt){if(!onc.active){for(const c of TB.cars)c.visible=false;return;}onc.s-=onc.v*dt;if(onc.s<-110){onc.active=false;return;}placeTrain(TB,onc.s,4,true);
  const gap=onc.s-G.s;if(!onc.honk&&gap<300&&gap>0){onc.honk=true;hornSfx();}if(!onc.woosh&&gap<14){onc.woosh=true;whoosh();}}


/* ======================= 鏡頭（直向畫面自動擴闊視角） ======================= */
const _h=new THREE.Vector3(),_f=new THREE.Vector3(),_cl=new THREE.Vector3(),_eye=new THREE.Vector3(),_ql=new THREE.Quaternion(),_qe=new THREE.Euler(),_sf=new THREE.Vector3(),_sp=new THREE.Vector3();
let lookDrag=null;
function fovFor(mode){const a=camera.aspect,h=mode==='cab'?70:mode==='door'?58:62,v=2*Math.atan(Math.tan(h*Math.PI/360)/a)*180/Math.PI;return clamp(v,mode==='cab'?62:48,mode==='cab'?88:80);}
function updCam(dt){if(G.cam==='free')return;const t=G.time,fv=fovFor(G.cam);if(Math.abs(camera.fov-fv)>0.01){camera.fov=fv;camera.updateProjectionMatrix();}
  if(G.cam==='cab'){const car=TA.cars[0],vf=G.v/VMAX;_eye.copy(EYE);_eye.x+=Math.sin(t*1.3)*0.008*vf;_eye.y+=Math.sin(t*2.7)*0.006*vf+(G.bump||0);
    car.updateMatrixWorld();camera.position.copy(_eye.applyMatrix4(car.matrixWorld));
    if(!lookDrag){G.yaw*=Math.exp(-dt*1.2);G.pitch*=Math.exp(-dt*1.2);}
    _qe.set(-0.10+G.pitch,0.05+G.yaw,Math.sin(t*1.1)*0.003*vf,'YXZ');_ql.setFromEuler(_qe);camera.quaternion.copy(car.quaternion).multiply(_ql);return;}
  if(G.cam==='platform'){const a=CAM.anchor,P=camera.aspect<1?CAM.platP:CAM.platL;posAt(a,_h);dirAt(a,_f);const rx=-_f.z,rz=_f.x;
    camera.position.set(_h.x+rx*P.lat+_f.x*P.fwd+Math.sin(t*0.3)*0.08,PT+P.h,_h.z+rz*P.lat+_f.z*P.fwd);posAt(a-P.back,_cl);_cl.x+=rx*P.llat;_cl.z+=rz*P.llat;_cl.y=RT+P.ly;camera.lookAt(_cl);return;}
  if(G.cam==='door'){const s=CAM.doorS;frame(s+2.7+Math.sin(t*0.25)*0.12,-4.9,PT+1.55,camera.position);frame(s-0.3,-1.0,RT+2.0,_cl);camera.lookAt(_cl);return;}
  const a=Math.sin(t*0.05),tg={side:10,up:7.5+1.5*Math.sin(t*0.09),fwd:a*27-12,back:16,look:2.0},k=camInit?1-Math.exp(-dt*1.4):1;camInit=true;
  for(const key in tg)CAM[key]+=(tg[key]-CAM[key])*k;
  posAt(G.s,_h);dirAt(G.s,_f);const rx=-_f.z,rz=_f.x;camera.position.set(_h.x+rx*CAM.side+_f.x*CAM.fwd,RT+CAM.up,_h.z+rz*CAM.side+_f.z*CAM.fwd);posAt(G.s-CAM.back,_cl);_cl.y=RT+CAM.look;camera.lookAt(_cl);}
function updSun(){_sf.set(0,0,-1).applyQuaternion(camera.quaternion);_sp.copy(camera.position).addScaledVector(_sf,35);_sp.y=DECK;sun.target.position.copy(_sp);sun.position.copy(_sp).addScaledVector(SUN,250);sun.target.updateMatrixWorld();}

/* ======================= 主迴圈 ======================= */
let last=performance.now(),perfT=0,perfN=0,perfDone=false;
function frameLoop(now){requestAnimationFrame(frameLoop);const dt=Math.min(0.05,(now-last)/1000);last=now;G.time+=dt;
  if(G.state==='drive')updDrive(dt);
  const dd=G.doorT-G.doors;G.doors+=Math.sign(dd)*Math.min(Math.abs(dd),dt/1.6);
  placeTrain(TA,G.s,0,false);for(const m of TA.leaves)m.scale.x=Math.max(0.03,1-G.doors*0.97);TM.doorLamp.color.setHex(G.doors>0.02?0xff3030:0x3a1010);
  updPSD(dt);updLandmarks(G.time);updOnc(dt);updE5(dt);updBoats(dt);updPeople(dt);updCars(dt);texWaterN.offset.x+=dt*0.004;texWaterN.offset.y+=dt*0.012;
  if(G.v>2&&Math.floor(G.prevS/25)!==Math.floor(G.s/25)){jointClacks(G.v);G.bumpE=0.008+0.012*G.v/VMAX;}G.prevS=G.s;G.bump=(G.bumpE||0)*Math.sin(G.time*38);G.bumpE=(G.bumpE||0)*Math.exp(-dt*9);
  updCam(dt);updSun();updCab(dt);
  audWatch(dt);setTrainSound(G.v,G.a);updSqueal(G.v,G.state==='drive'&&(G.notch<0||G.tasc));
  if(G.state!=='title'&&G.state!=='loading')updHUD();if(G.state==='drive'||G.state==='stopped')updDriveHUD();
  if(G.post)composer.render();else renderer.render(scene,camera);
  if(!perfDone&&G.state==='drive'){perfT+=dt;perfN++;if(perfT>4){perfDone=true;const avg=perfT/perfN;if(avg>0.034){G.post=false;setPR(1);}else if(avg>0.024&&PR>1)setPR(1);}}}

/* ======================= 按鍵／鍵盤／拖曳望 ======================= */
$('#rJY').onclick=()=>startRoute(undefined,'jy');$('#rEAL').onclick=()=>startRoute(undefined,'eal');
$('#btnMap').onclick=()=>{initAudio();openMap('jy');};$('#btnMapE').onclick=()=>{initAudio();openMap('eal');};$('#ymClose').onclick=()=>$('#ymap').classList.add('hidden');
$('#btnHome').onclick=()=>goTitle();
$('#btnMute').onclick=()=>{G.muted=!G.muted;$('#btnMute').innerHTML=IC(G.muted?'mute':'sound');if(BUS)BUS.gain.value=G.muted?0:1;if(G.muted)stopSpeech();};
$('#qsay').onclick=()=>{if(QS&&!QS.locked)speakQ(QS.q);};
$('#fAgain').onclick=()=>startRoute();$('#fHome').onclick=()=>goTitle();
$('#aAnn').onclick=onAnnDepart;$('#aDoor').onclick=onCloseDoor;$('#bOpen').onclick=onOpenDoor;$('#bAnn2').onclick=onAnnApproach;
$('#bHorn').onclick=()=>{initAudio();hornSfx();};
addEventListener('keydown',e=>{if(G.state==='drive'){if(e.key==='ArrowUp'||e.key==='w'||e.key==='ArrowRight')stepNotch(1);if(e.key==='ArrowDown'||e.key==='s'||e.key==='ArrowLeft')stepNotch(-1);if(e.key==='a')onAnnApproach();}
  if(e.key===' '){e.preventDefault();hornSfx();}if(e.key==='Enter'){if(G.state==='stopped')onOpenDoor();else if(G.state==='board')(G.annReady?onCloseDoor:onAnnDepart)();}});
canvas.addEventListener('pointerdown',e=>{if(G.cam!=='cab')return;lookDrag={x:e.clientX,y:e.clientY,yaw:G.yaw,pitch:G.pitch};});
addEventListener('pointermove',e=>{if(!lookDrag)return;G.yaw=clamp(lookDrag.yaw-(e.clientX-lookDrag.x)*0.004,-0.9,0.9);G.pitch=clamp(lookDrag.pitch-(e.clientY-lookDrag.y)*0.003,-0.35,0.25);});
for(const ev of ['pointerup','pointercancel'])addEventListener(ev,()=>{lookDrag=null;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let TL=1,testType=null;
function openTest(){const g=$('#tgrid');g.innerHTML='';for(const [ck,c] of Object.entries(CATS)){const h=document.createElement('div');h.className='tsec';h.innerHTML=`${IC(c.i)} ${c.n}`;g.appendChild(h);
  for(const k of typesOf(ck)){const b=document.createElement('button');b.style.setProperty('--c',c.c);b.textContent=QT[k][1];b.onclick=()=>runTest(k);g.appendChild(b);}}$('#test').classList.remove('hidden');}
function runTest(k){testType=k;qProg(-1);$('#test').classList.add('hidden');$('#title').classList.add('hidden');showCard(true);const go=()=>{if(testType!==k||$('#qwrap').classList.contains('hidden'))return;renderQ(makeQ(k,TL),()=>setTimeout(go,300));};go();}
$('#btnTest').onclick=()=>{initAudio();unlockSpeech();openTest();};
$('#tClose').onclick=()=>{$('#test').classList.add('hidden');if(G.state==='title')$('#title').classList.remove('hidden');};
$('#qclose').onclick=()=>{testType=null;stopSpeech();hideCard();openTest();};
$$('.lv button').forEach(b=>b.onclick=()=>{TL=+b.dataset.l;$$('.lv button').forEach(x=>x.classList.toggle('on',x===b));});

/* ======================= 開機 ======================= */
function boot(){try{
    buildTrack();{const n0=scene.children.length;buildShinViaduct();LMK.shv=scene.children.slice(n0);}buildStreets();buildCity();planStreetTrees();buildScenery();buildScenery2();buildTrees();buildHouses();buildStations();buildPeople();
    TA=buildTrain('e235',5);TB=buildTrain('e233',5);for(const c of TB.cars)c.visible=false;TE=buildE5(6);for(const c of TE.cars)c.visible=false;buildCab(TA.cars[0]);buildNotchBar();
    loadProg();applySection(PROG.sec);updTitleCard();
    G.s=ST[0].stop;G.prevS=G.s;resetPeople();placeTrain(TA,G.s,0,false);G.state='title';updCam(0);updSun();renderer.compile(scene,camera);
    $('#loading').classList.add('hidden');$('#title').classList.remove('hidden');icoWarm();requestAnimationFrame(t=>{last=t;frameLoop(t);});
  }catch(e){console.error(e);$('#loading').innerHTML=`<div>載入失敗，請重新整理</div><div style="font-size:14px;max-width:80vw;color:#a33">${e&&e.message}</div>`;}}
function iconSheet(keys){const d=document.createElement('div');d.id='sheet';d.style.cssText='position:fixed;inset:0;z-index:99;background:#e9eef3;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:8px';
  for(const k of keys||Object.keys(IB)){const c=document.createElement('div');c.style.cssText='text-align:center;font:11px sans-serif;color:#333';c.innerHTML=`<img src="${icon(k)}" style="width:92px;height:92px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.2))"><div>${k}</div>`;d.appendChild(c);}document.body.appendChild(d);return Object.keys(IB).length;}
window.__kg={get AC(){return AC;},get BUS(){return BUS;},get LINE(){return LINE;},setLineData,switchLineVisuals,loadProg,applySection,get LMK(){return LMK;},qtest:(k,l=2)=>{$('#title').classList.add('hidden');showCard(true);renderQ(makeQ(k,l),()=>{});return Object.keys(QT);},iconSheet,icon,get IB(){return IB;},get TE(){return TE;},SK,G,ST,CAM,startRoute,goTitle,setCam,setMascon,stepNotch,onc,CAB,PP,renderer,camera,scene,composer,get QS(){return QS;},onAnnDepart,onCloseDoor,onOpenDoor,onAnnApproach};
setTimeout(boot,60);
